<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Líderes · RH Nagumo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sidebar.css">
<link rel="stylesheet" href="../light-theme.css">
<link rel="stylesheet" href="../responsive.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="../firebase.js"></script>
<script src="../permissions.js"></script>
<script src="../shared.js"></script>
<style>
/* ════════════════════════════════════════════
   VARIÁVEIS
════════════════════════════════════════════ */
:root {
  --bg:#0b0d14; --surface:#12151f; --surface2:#1a1e2e; --surface3:#222638;
  --border:#2a2f45; --accent:#4f8ef7; --accent2:#a78bfa;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171; --orange:#fb923c;
  --cyan:#22d3ee; --text:#ffffff; --muted:#94a3b8;
  --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  --sidebar-w:220px;
}

/* ── Base ── */
* { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; }
body { background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; overflow-x:hidden; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--surface); }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }

/* ── Main ── */
.main { margin-left:var(--sidebar-w); padding:24px 28px; min-height:100vh; }
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
.page-title { font-family:var(--font-head); font-size:28px; font-weight:800; letter-spacing:-1.5px; color:var(--text); }

/* ── Botões ── */
.btn {
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px;
  border-radius:8px; border:none; font-family:var(--font-body);
  font-size:12px; font-weight:600; cursor:pointer; transition:all .2s;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#3a7ae0; transform:translateY(-1px); box-shadow:0 4px 16px rgba(79,142,247,.4); }
.btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface3); }
.btn-danger { background:rgba(248,113,113,.15); color:var(--red); border:1px solid rgba(248,113,113,.3); }
.btn-danger:hover { background:rgba(248,113,113,.25); }
.btn-sm { padding:5px 11px; font-size:11px; }

/* ════════════════════════════════════════════
   BARRA DE FILTROS + BUSCA
════════════════════════════════════════════ */
.filter-bar {
  display:flex; align-items:center; gap:10px;
  margin-bottom:22px; flex-wrap:wrap;
}

/* Campo de busca — mesmo padrão de employees.html */
.search-wrap { position:relative; }
.search-icon {
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:14px; pointer-events:none;
}
.search-input {
  background:var(--surface); border:1px solid var(--border);
  border-radius:9px; color:var(--text); font-family:var(--font-body);
  font-size:13px; padding:8px 12px 8px 34px; outline:none;
  transition:border-color .2s; width:220px;
}
.search-input:focus { border-color:var(--accent); }
.search-input::placeholder { color:var(--muted); }
body.light-theme .search-input { background:#fff; border-color:#B0C4D4; color:#04152E; }
body.light-theme .search-input::placeholder { color:#7A9AB5; }
body.light-theme .search-input:focus { border-color:#D40138; }

/* Chips de departamento */
.dept-chip {
  padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600;
  cursor:pointer; border:1px solid var(--border); background:var(--surface);
  color:var(--muted); transition:all .15s; user-select:none; white-space:nowrap;
}
.dept-chip:hover  { border-color:var(--accent); color:var(--text); }
.dept-chip.active { background:rgba(79,142,247,.15); border-color:var(--accent); color:var(--accent); }

/* ════════════════════════════════════════════
   HIERARQUIA — SEÇÕES
════════════════════════════════════════════ */
.hierarquia-secao {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 14px;
  margin-top: 10px; margin-bottom: 4px;
}
.hierarquia-secao:first-child { margin-top: 0; }
.hierarquia-label {
  font-family: var(--font-head); font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 2px; white-space: nowrap;
  padding: 4px 14px; border-radius: 20px;
}
.hierarquia-linha {
  flex: 1; height: 1px; background: var(--border); opacity: 0.6;
}
.hierarquia-label.diretoria  { background:rgba(251,146,60,.15);  color:#fb923c; border:1px solid rgba(251,146,60,.35); }
.hierarquia-label.gerencia   { background:rgba(167,139,250,.15); color:#a78bfa; border:1px solid rgba(167,139,250,.35); }
.hierarquia-label.coordenacao{ background:rgba(251,191,36,.15);  color:#fbbf24; border:1px solid rgba(251,191,36,.35); }
.hierarquia-label.encarregado{ background:rgba(52,211,153,.15);  color:#34d399; border:1px solid rgba(52,211,153,.35); }
.hierarquia-label.lider      { background:rgba(255,255,255,.08); color:#e2e8f0; border:1px solid rgba(255,255,255,.2); }

/* ════════════════════════════════════════════
   LEADERS GRID
════════════════════════════════════════════ */
.leaders-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px,1fr));
  gap:18px;
}

/* ── Card ── */
.leader-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:16px; overflow:hidden;
  transition:border-color .2s, transform .2s, box-shadow .2s;
  display:flex; flex-direction:column;
}
.leader-card.nivel-diretoria   { border-color:rgba(251,146,60,.6);  }
.leader-card.nivel-gerencia    { border-color:rgba(167,139,250,.6); }
.leader-card.nivel-coordenacao { border-color:rgba(251,191,36,.6);  }
.leader-card.nivel-encarregado { border-color:rgba(52,211,153,.6);  }
.leader-card.nivel-lider       { border-color:rgba(255,255,255,.25);}

.leader-card.nivel-diretoria:hover   { border-color:#fb923c; box-shadow:0 8px 28px rgba(251,146,60,.2);  transform:translateY(-3px); }
.leader-card.nivel-gerencia:hover    { border-color:#a78bfa; box-shadow:0 8px 28px rgba(167,139,250,.2); transform:translateY(-3px); }
.leader-card.nivel-coordenacao:hover { border-color:#fbbf24; box-shadow:0 8px 28px rgba(251,191,36,.2);  transform:translateY(-3px); }
.leader-card.nivel-encarregado:hover { border-color:#34d399; box-shadow:0 8px 28px rgba(52,211,153,.2);  transform:translateY(-3px); }
.leader-card.nivel-lider:hover       { border-color:rgba(255,255,255,.6); box-shadow:0 8px 28px rgba(255,255,255,.08); transform:translateY(-3px); }

/* Card destacado (resultado de busca) */
.leader-card.highlight {
  box-shadow:0 0 0 2px var(--accent), 0 8px 28px rgba(79,142,247,.3) !important;
  border-color:var(--accent) !important;
  transform:translateY(-2px) !important;
}

/* ── Card do líder com aptidões pendentes — pulsante ── */
.leader-card.apt-pendente {
  border-color: rgba(244,114,182,.7) !important;
  animation: leader-apt-pulse 2.6s ease-in-out infinite;
  position: relative;
}
.leader-card.apt-pendente::after {
  content: '🎯';
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 16px;
  animation: leader-apt-badge-pulse 2.6s ease-in-out infinite;
  z-index: 2;
  pointer-events: none;
}
@keyframes leader-apt-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(244,114,182,.55); }
  60%  { box-shadow: 0 0 0 10px rgba(244,114,182,.0);  }
  100% { box-shadow: 0 0 0 0   rgba(244,114,182,.0);  }
}
@keyframes leader-apt-badge-pulse {
  0%,100% { transform: scale(1);   opacity: 1; }
  50%      { transform: scale(1.3); opacity: .7; }
}
/* Faixa superior do card pulsante — rosa/pink em vez da cor padrão do nível */
.leader-card.apt-pendente::before {
  background: linear-gradient(90deg,#f472b6,#a78bfa) !important;
  animation: stripe-flow 1.8s linear infinite;
  background-size: 200% 100% !important;
}
@keyframes stripe-flow {
  0%   { background-position: 0%   }
  100% { background-position: 200% }
}
/* Tooltip do badge */
.apt-pendente-tooltip {
  position: absolute; top: -34px; right: 0;
  background: #1a1e2e; border: 1px solid rgba(244,114,182,.5);
  border-radius: 8px; padding: 4px 10px;
  font-size: 10px; font-weight: 700; color: #f472b6;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .2s;
  z-index: 10;
}
.leader-card.apt-pendente:hover .apt-pendente-tooltip { opacity: 1; }

/* Tema claro */
body.light-theme .leader-card.apt-pendente { border-color: rgba(219,39,119,.5) !important; }
body.light-theme .leader-card.apt-pendente::after { filter: none; }
@keyframes leader-apt-pulse-light {
  0%   { box-shadow: 0 0 0 0   rgba(219,39,119,.4); }
  60%  { box-shadow: 0 0 0 10px rgba(219,39,119,.0);  }
  100% { box-shadow: 0 0 0 0   rgba(219,39,119,.0);  }
}
body.light-theme .leader-card.apt-pendente {
  animation: leader-apt-pulse-light 2.6s ease-in-out infinite;
}

/* Banner inline no card (sem depender de ::after) */
.leader-apt-banner {
  display: flex; align-items: center; gap: 7px;
  margin: 0 18px 10px;
  padding: 7px 12px; border-radius: 8px;
  background: rgba(244,114,182,.12);
  border: 1px solid rgba(244,114,182,.35);
  font-size: 11px; font-weight: 700; color: #f472b6;
  cursor: pointer;
  transition: background .15s;
}
.leader-apt-banner:hover { background: rgba(244,114,182,.22); }
body.light-theme .leader-apt-banner {
  background: rgba(219,39,119,.08); border-color: rgba(219,39,119,.3); color: #db2777;
}

.leader-card::before {
  content:''; display:block; height:3px; background:var(--border); flex-shrink:0;
}
.leader-card.nivel-diretoria::before   { background:linear-gradient(90deg,#fb923c,#f97316); }
.leader-card.nivel-gerencia::before    { background:linear-gradient(90deg,#a78bfa,#7c3aed); }
.leader-card.nivel-coordenacao::before { background:linear-gradient(90deg,#fbbf24,#d97706); }
.leader-card.nivel-encarregado::before { background:linear-gradient(90deg,#34d399,#059669); }
.leader-card.nivel-lider::before       { background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.1)); }

/* ── Card header ── */
.card-header { padding:18px 18px 14px; display:flex; align-items:flex-start; gap:14px; }
.leader-avatar {
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:17px; font-weight:800; color:#fff;
}
.leader-info { flex:1; min-width:0; }
.leader-name { font-family:var(--font-head); font-size:17px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.leader-role { font-size:12px; color:var(--muted); margin-top:3px; }
.leader-badge {
  flex-shrink:0; display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700; white-space:nowrap;
}

/* ── Métricas ── */
.card-metrics { padding:0 18px 14px; display:flex; gap:20px; align-items:flex-end; }
.metric-big { display:flex; flex-direction:column; gap:2px; }
.metric-big-val { font-family:var(--font-head); font-size:22px; font-weight:800; letter-spacing:-1px; }
.metric-big-val.time   { color:var(--text); }
.metric-big-val.desemp { color:var(--green); }
.metric-big-val.score  { color:var(--accent2); }
.metric-big-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); }

/* ── Team avatars ── */
.team-section { padding:0 18px 14px; }
.team-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:8px; }
.team-avatars { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
.avatar-bubble {
  width:30px; height:30px; border-radius:50%;
  background:var(--surface3); border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--muted); font-family:var(--font-head);
}
.avatar-more {
  padding:0 8px; height:30px; border-radius:15px;
  background:var(--surface3); border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--muted);
}

/* ── Stat boxes ── */
.card-stats { padding:0 18px 14px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stat-box { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
.stat-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:5px; }
.stat-val { font-family:var(--font-head); font-size:20px; font-weight:800; letter-spacing:-1px; }
.stat-val.assid  { color:var(--green); }
.stat-val.faltas { color:var(--text); }
.stat-val.promo  { color:var(--green); }
.stat-val.risco  { color:var(--red); }
.stat-val.assid.low { color:var(--yellow); }

/* ── Score footer ── */
.score-footer {
  margin:0 18px 18px; padding:10px 16px;
  background:rgba(79,142,247,.08); border:1px solid rgba(79,142,247,.2);
  border-radius:10px; display:flex; align-items:center; gap:8px;
}
.score-footer-label { font-size:12px; font-weight:600; color:var(--muted); flex:1; }
.score-footer span  { font-family:var(--font-head); font-size:18px; font-weight:800; color:var(--accent2); }

/* ── Ações admin ── */
.card-actions { padding:0 18px 16px; display:flex; gap:8px; flex-wrap:wrap; }

/* ════════════════════════════════════════════
   MODAL ÁRVORE HIERÁRQUICA
════════════════════════════════════════════ */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.75);
  backdrop-filter:blur(4px); z-index:200;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.overlay.open { display:flex; }

/* Modal padrão */
.modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:28px; width:500px;
  max-width:95vw; max-height:90vh; overflow-y:auto;
  animation:fadeUp .25s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.modal-title { font-family:var(--font-head); font-size:18px; font-weight:800; margin-bottom:22px; color:var(--text); }
.modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group.full { grid-column:1/-1; }
.form-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.form-input {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:var(--font-body); font-size:13px;
  padding:9px 11px; outline:none; transition:border-color .2s;
}
.form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,142,247,.1); }
.form-input option { background:var(--surface2); }

/* Modal da árvore hierárquica — mais largo */
.modal-tree {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; width:780px; max-width:96vw;
  max-height:92vh; overflow:hidden;
  display:flex; flex-direction:column;
  animation:fadeUp .25s ease;
}
.modal-tree-header {
  padding:20px 24px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; flex-shrink:0;
}
.modal-tree-avatar {
  width:46px; height:46px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:16px; font-weight:800; color:#fff;
}
.modal-tree-info { flex:1; }
.modal-tree-name { font-family:var(--font-head); font-size:18px; font-weight:800; color:var(--text); }
.modal-tree-sub  { font-size:12px; color:var(--muted); margin-top:3px; }
.modal-tree-close {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:6px 12px; color:var(--muted);
  font-size:12px; font-weight:600; cursor:pointer;
  transition:all .15s; display:flex; align-items:center; gap:5px;
  font-family:var(--font-body);
}
.modal-tree-close:hover { border-color:var(--red); color:var(--red); }

/* Breadcrumb de navegação */
.tree-breadcrumb {
  padding:10px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  background:var(--surface2); flex-shrink:0; min-height:42px;
}
.tree-breadcrumb:empty { display:none; }
.bc-item {
  display:inline-flex; align-items:center; gap:5px;
  font-size:12px; font-weight:600; color:var(--accent);
  cursor:pointer; padding:3px 8px; border-radius:6px;
  transition:background .12s;
}
.bc-item:hover { background:rgba(79,142,247,.12); }
.bc-item.current { color:var(--text); cursor:default; }
.bc-item.current:hover { background:transparent; }
.bc-sep { color:var(--muted); font-size:11px; }

/* Corpo da árvore */
.modal-tree-body { padding:20px 24px; overflow-y:auto; flex:1; }

/* Nó raiz — o líder selecionado */
.tree-root-card {
  background:rgba(79,142,247,.06); border:1.5px solid rgba(79,142,247,.3);
  border-radius:12px; padding:14px 18px; margin-bottom:20px;
  display:flex; align-items:center; gap:14px;
}
.tree-root-avatar {
  width:46px; height:46px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:15px; font-weight:800; color:#fff;
}
.tree-root-info { flex:1; }
.tree-root-name { font-family:var(--font-head); font-size:16px; font-weight:800; color:var(--text); }
.tree-root-meta { font-size:12px; color:var(--muted); margin-top:3px; }

/* Linha conectora vertical */
.tree-connector {
  display:flex; flex-direction:column; gap:0;
  padding-left:20px; margin-bottom:16px;
  border-left:2px dashed rgba(79,142,247,.25);
  margin-left:22px;
}
.tree-connector-label {
  font-size:9px; font-weight:700; text-transform:uppercase;
  letter-spacing:1.5px; color:var(--muted); margin-bottom:8px;
  padding-left:14px; padding-top:8px;
  display:flex; align-items:center; gap:6px;
}
.tree-connector-label::before {
  content:''; display:inline-block; width:10px; height:2px;
  background:rgba(79,142,247,.35); margin-left:-14px; margin-right:4px; flex-shrink:0;
}

/* Cards dos subordinados (líderes abaixo) */
.tree-sub-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:12px 14px; margin-bottom:8px;
  display:flex; align-items:center; gap:12px;
  cursor:pointer; transition:all .15s; position:relative;
}
.tree-sub-card:hover { background:var(--surface3); border-color:var(--accent); transform:translateX(2px); }
.tree-sub-card.clickable::after {
  content:'›'; position:absolute; right:14px; top:50%; transform:translateY(-50%);
  color:var(--accent); font-size:18px; font-weight:800; opacity:.7;
}
.tree-sub-avatar {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:11px; font-weight:800; color:#fff;
}
.tree-sub-info { flex:1; min-width:0; }
.tree-sub-name { font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tree-sub-meta { font-size:11px; color:var(--muted); }
.tree-sub-badge {
  font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px;
  white-space:nowrap; flex-shrink:0; margin-right:20px;
}
.tree-sub-stats {
  display:flex; gap:10px; flex-shrink:0; margin-right:20px;
}
.tree-sub-stat { font-size:11px; font-weight:600; }

/* Cards dos funcionários operacionais */
.tree-emp-cards {
  display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;
}
.tree-emp-card {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:9px; padding:10px 12px;
  display:flex; align-items:center; gap:10px;
}
.tree-emp-avatar {
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#4f8ef7,#3b6fd4);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:9px; font-weight:800; color:#fff;
}
.tree-emp-info { flex:1; min-width:0; }
.tree-emp-name { font-size:12px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tree-emp-meta { font-size:10px; color:var(--muted); }

/* Estado vazio da árvore */
.tree-empty {
  text-align:center; padding:40px 20px; color:var(--muted);
}
.tree-empty-icon { font-size:36px; margin-bottom:10px; }

/* Estatísticas resumidas no topo da árvore */
.tree-stats-row {
  display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
}
.tree-stat-pill {
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:20px; font-size:11px; font-weight:600;
  background:var(--surface2); border:1px solid var(--border);
}

/* ── Empty state ── */
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; }
.empty-icon  { font-size:52px; margin-bottom:14px; }

/* ── Toast ── */
.toast-container { position:fixed; bottom:24px; right:24px; z-index:99999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { padding:10px 18px; border-radius:10px; font-size:12px; font-family:var(--font-body); box-shadow:0 4px 20px rgba(0,0,0,.4); animation:fadeUp .25s ease; max-width:320px; pointer-events:auto; }
.toast.ok    { background:#0f2a1a; border:1px solid #22c55e; color:#86efac; }
.toast.warn  { background:#422006; border:1px solid #f97316; color:#fdba74; }
.toast.error { background:#2a0a0a; border:1px solid #f87171; color:#fca5a5; }

/* ── Foto do líder ── */
.foto-upload-wrap { display:flex; align-items:center; gap:14px; margin-bottom:4px; }
.foto-preview-lider {
  width:64px; height:64px; border-radius:50%; object-fit:cover;
  border:2px solid var(--border); flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:20px; font-weight:800; color:#fff; overflow:hidden;
}
.foto-preview-lider img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.foto-btns { display:flex; flex-direction:column; gap:6px; }
.btn-foto {
  padding:6px 14px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-family:var(--font-body);
  font-size:11px; font-weight:600; cursor:pointer; transition:all .15s;
}
.btn-foto:hover { border-color:var(--accent); color:var(--accent); }
.btn-foto.remove:hover { border-color:var(--red); color:var(--red); }

/* ════════════════════════════════════════════
   MODAL ORGANOGRAMA CIRCULAR
════════════════════════════════════════════ */
.modal-org-circular {
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; width:760px; max-width:96vw;
  max-height:94vh; overflow:hidden;
  display:flex; flex-direction:column;
  animation:fadeUp .3s ease;
}
.modal-org-header {
  display:flex; align-items:center; gap:14px;
  padding:20px 24px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.modal-org-avatar {
  width:46px; height:46px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:16px; font-weight:800; color:#fff;
}
.modal-org-info { flex:1; }
.modal-org-name { font-family:var(--font-head); font-size:18px; font-weight:800; color:var(--text); }
.modal-org-sub  { font-size:12px; color:var(--muted); margin-top:3px; }
.modal-org-close {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:6px 12px; color:var(--muted);
  font-size:12px; font-weight:600; cursor:pointer;
  transition:all .15s; font-family:var(--font-body);
}
.modal-org-close:hover { border-color:var(--red); color:var(--red); }
#org-chart-container {
  flex:1; overflow:auto; display:flex;
  align-items:flex-start; justify-content:center;
  padding:24px; background:var(--bg); min-height:400px;
}
#org-chart-container svg { display:block; flex-shrink:0; }

/* Botão Organograma — aparece durante busca ativa */
#btn-organograma {
  background:rgba(34,211,238,.12); color:var(--cyan);
  border:1px solid rgba(34,211,238,.35);

}
#btn-organograma:hover {

body.light-theme #btn-organograma { background:rgba(6,182,212,.1); color:#0891b2; border-color:rgba(6,182,212,.3); }

/* ── Responsive ── */
@media(max-width:1024px) {
  :root { --sidebar-w:56px; }
  .tree-emp-cards { grid-template-columns:1fr; }

@media(max-width:768px) {

}

<script>
// ════════════════════════════════════════════════════════
// ESTADO
// ════════════════════════════════════════════════════════
let currentUser      = null;
let activeDeptFilter = '';
let _store           = null;
let _allPonto        = {};

// Estado da busca de líder (texto simples)
let _searchLeaderQuery = '';     // Texto atual no campo de busca

// Estado da árvore hierárquica
let _treeRootId   = null;        // líder raiz do modal de árvore
let _treePath     = [];          // trilha de navegação: [{ id, name }]
let _currentSearchLeaderId = null; // líder alvo do organograma circular

const APT_KEYS = ['qual','prio','know','comm','prod','assid','org','equip','cria','motv'];

const NIVEL_META = {
  admin_master: { label:'Admin Master', emoji:'🛡️', cor:'#f87171' },
  diretoria:    { label:'Diretoria',    emoji:'🏢', cor:'#fb923c' },
  gerencia:     { label:'Gerência',     emoji:'📊', cor:'#fbbf24' },
  coordenacao:  { label:'Coordenação',  emoji:'📋', cor:'#a78bfa' },
  encarregado:  { label:'Encarregado',  emoji:'🔰', cor:'#22d3ee' },
  lider:        { label:'Líder',        emoji:'👷', cor:'#4f8ef7' },
};

const HIERARQUIA_ORDER = ['diretoria','gerencia','coordenacao','encarregado','lider'];
const ORDEM_IDX        = ['lider','encarregado','coordenacao','gerencia','diretoria'];

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await requireSession();
  if (!currentUser) return;

  initTheme();
  initSidebar('leaders', currentUser);

  const perfil  = getUserPerfil(currentUser);
  const btnNovo = document.getElementById('btn-novo');
  if (btnNovo) btnNovo.style.display = perfil === 'admin_master' ? '' : 'none';

  buildDeptChips();
  renderLeaders();
});

// ════════════════════════════════════════════════════════
// SCORE HELPERS (síncronos, usam cache _store/_allPonto)
// ════════════════════════════════════════════════════════
function getWeights() {
  const cfg = _store?.config || {};
  const pw  = Math.min(100, Math.max(0, parseInt(cfg.perfWeight)||40));
  const aw  = Math.min(100, Math.max(0, parseInt(cfg.aptWeight) ||35));
  return { perf:pw, apt:aw, abs:Math.max(0,100-pw-aw) };
}
function calcAptMedia(emp) {
  const c = emp.competencies || {};
  return APT_KEYS.reduce((s,k)=>s+(c[k]||0),0)/APT_KEYS.length;
}
function getTotalFaltasEmp(emp) {
  try {
    const ano = emp.year || new Date().getFullYear();
    let total = 0;
    for (let m = 1; m <= 12; m++) {
      const key  = `${emp.id}_${ano}_${String(m).padStart(2,'0')}`;
      const dias = _allPonto[key] || {};
      Object.values(dias).forEach(s => {
        if (s === 'falta')    total += 1;
        if (s === 'atestado') total += 0.5;
      });
    }
    return total > 0 ? total : (emp.absences||[]).reduce((a,b)=>a+b, 0);
  } catch(e) { return (emp.absences||[]).reduce((a,b)=>a+b, 0); }
}
function calcAssid(emp) {
  if (emp.afastado) return 100;
  const total  = getTotalFaltasEmp(emp);
  const maxAbs = _store?.config?.maxAbs || 36;
  return Math.max(0, 100-(total/maxAbs)*100);
}
function calcBonus(emp) {
  const BONUS_POR_DIA = 0.5, BONUS_MAX = 5;
  try {
    const ano = emp.year || new Date().getFullYear();
    const feriadosCustom = _store?.config?.feriadosCustom || [];
    const ferNac = [{d:1,m:0},{d:21,m:3},{d:1,m:4},{d:7,m:8},{d:12,m:9},{d:2,m:10},{d:15,m:10},{d:25,m:11}];
    let diasBonus = 0;
    for (let m = 1; m <= 12; m++) {
      const key  = `${emp.id}_${ano}_${String(m).padStart(2,'0')}`;
      const dias = _allPonto[key] || {};
      Object.entries(dias).forEach(([dStr, status]) => {
        if (status !== 'presente') return;
        const d = parseInt(dStr), dow = new Date(ano,m-1,d).getDay();
        if (dow === 0) { diasBonus++; return; }
        if (ferNac.some(f=>f.d===d&&f.m===(m-1))) { diasBonus++; return; }
        const mesStr=String(m).padStart(2,'0'), diaStr=String(d).padStart(2,'0');
        if (feriadosCustom.some(f=>f.chave===`${mesStr}-${diaStr}`)) diasBonus++;
      });
    }
    return Math.min(BONUS_MAX, diasBonus * BONUS_POR_DIA);
  } catch(e) { return 0; }
}
function calcScore(emp) {
  const w = getWeights();
  const base = emp.perf*(w.perf/100)+calcAptMedia(emp)*10*(w.apt/100)+calcAssid(emp)*(w.abs/100);
  return Math.min(100, Math.round(base + calcBonus(emp)));
}
function getEmpStatus(score) {
  if (score>=85) return { label:'🏆 Promoção', cls:'tag-promo' };
  if (score>=70) return { label:'✅ Regular',  cls:'tag-ok'   };
  if (score>=55) return { label:'⚠️ Atenção',  cls:'tag-watch'};
  return               { label:'🔴 Risco',    cls:'tag-risk' };
}

// ════════════════════════════════════════════════════════
// HELPERS DE ESCOPO DO LÍDER
// ════════════════════════════════════════════════════════
function getMeusDepts(leader) {
  const depts = leader.perfil?.depts || [];
  const setor = leader.setor || '';
  return [...new Set([...depts, ...(setor ? [setor] : [])])];
}
function getMeusFiliais(leader) {
  return leader.perfil?.filiais || (leader.perfil?.filial ? [leader.perfil.filial] : []);
}
function getMeusTurnos(leader) {
  return leader.perfil?.turnos || (leader.perfil?.turno ? [leader.perfil.turno] : []);
}
function getTeamEmps(leader, allEmps) {
  const depts  = getMeusDepts(leader);
  const turnos = getMeusTurnos(leader);
  if (!depts.length) return allEmps.filter(e=>(e.owner_id||e.ownerId)===leader.id);
  return allEmps.filter(e => {
    const deptOk  = depts.includes(e.dept);
    const turnoOk = turnos.length ? turnos.includes(e.turno) : true;
    return deptOk && turnoOk;
  });
}
function getSubordinados(leader, allUsers) {
  const meuIdx    = ORDEM_IDX.indexOf(leader.nivel || 'lider');
  const meusDepts = getMeusDepts(leader);
  return allUsers.filter(u => {
    if (u.id === ADMIN_ID || u.nivel === 'admin_master' || u.id === leader.id) return false;
    const uIdx = ORDEM_IDX.indexOf(u.nivel || 'lider');
    if (uIdx >= meuIdx) return false;
    if (!meusDepts.length) return false;
    return meusDepts.some(d => getMeusDepts(u).includes(d));
  });
}
function getTeamTotal(leader, store) {
  const allEmps  = store.employees || [];
  const allUsers = Object.values(store.users||{}).filter(u=>u.id!==ADMIN_ID&&u.nivel!=='admin_master'&&u.id!==leader.id);
  const meuIdx   = ORDEM_IDX.indexOf(leader.nivel||'lider');
  const meusDepts= getMeusDepts(leader);
  const meusTurnos=getMeusTurnos(leader);

  let totalFuncionarios;
  if (!meusDepts.length) {
    totalFuncionarios = allEmps.filter(e=>(e.owner_id||e.ownerId)===leader.id).length;
  } else {
    totalFuncionarios = allEmps.filter(e => {
      const deptOk  = meusDepts.includes(e.dept);
      const turnoOk = meusTurnos.length ? meusTurnos.includes(e.turno) : true;
      return deptOk && turnoOk;
    }).length;
  }
  const subordinados = allUsers.filter(u => {
    const uIdx = ORDEM_IDX.indexOf(u.nivel||'lider');
    if (uIdx >= meuIdx) return false;
    if (!meusDepts.length) return false;
    return meusDepts.some(d=>getMeusDepts(u).includes(d));
  });
  return totalFuncionarios + subordinados.length;
}
function getLiderDoFuncionario(emp, store) {
  const users = Object.values(store.users||{});
  const dept = emp.dept||'', turno = emp.turno||'';
  for (const nivel of HIERARQUIA_ORDER.slice().reverse()) {
    const match = users.find(u => {
      if (u.id===ADMIN_ID||u.nivel==='admin_master') return false;
      if ((u.nivel||'lider')!==nivel) return false;
      const depts      = getMeusDepts(u);
      const liderTurno = u.perfil?.turno||'';
      const deptOk     = depts.length ? depts.includes(dept) : (emp.owner_id||emp.ownerId)===u.id;
      const turnoOk    = liderTurno ? liderTurno===turno : true;
      return deptOk && turnoOk;
    });
    if (match) return match;
  }
  return null;
}
function calcLeaderScore(teamEmps) {
  if (!teamEmps.length) return 0;
  return +(teamEmps.reduce((s,e)=>s+calcAptMedia(e),0)/teamEmps.length).toFixed(1);
}

// Retorna todos os subordinados recursivamente
function getSubordinadosRecursivo(leaderId, allLeaders) {
  const leader = _store?.users?.[leaderId];
  if (!leader) return [];
  const diretos = getSubordinados(leader, allLeaders);
  const result  = [...diretos];
  diretos.forEach(sub => {
    result.push(...getSubordinadosRecursivo(sub.id, allLeaders));
  });
  return result;
}

function buildCard(leader, store, isAdmin, isHighlight=false) {
  const allEmps = store.employees || [];
  const team    = getTeamEmps(leader, allEmps);
  const nivel   = leader.nivel || 'lider';
  const meta    = NIVEL_META[nivel] || NIVEL_META['lider'];

  const totalTime   = team.length;
  const avgDesemp   = totalTime ? Math.round(team.reduce((s,e)=>s+e.perf,0)/totalTime) : 0;
  const avgAssid    = totalTime ? Math.round(team.reduce((s,e)=>s+calcAssid(e),0)/totalTime) : 0;
  const totalFaltas = team.reduce((s,e)=>s+getTotalFaltasEmp(e),0);
  const promos      = team.filter(e=>calcScore(e)>=85).length;
  const riscos      = team.filter(e=>calcScore(e)<55).length;
  const leaderScore = calcLeaderScore(team);
  const totalHierarquico = getTeamTotal(leader, store);

  const ini = leader.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  const roleParts = [leader.perfil?.funcao||'', leader.setor||(leader.perfil?.depts||[])[0]||''].filter(Boolean).join(' · ');

    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
  })();
  const aptPendentesTeam = team.filter(e => !e.afastado && !e.demitido && !(e.competencies_history||{})[mesAtualKey]);

      ${podOcorr    ? `<button class="btn btn-sm" style="background:rgba(167,139,250,.1);color:var(--accent2);border:1px solid rgba(167,139,250,.3)" onclick="openLeaderOcorrencia('${leader.id}')">📝 Ocorrência</button>` : ''}
      <button class="btn btn-sm" style="background:rgba(34,211,238,.1);color:var(--cyan);border:1px solid rgba(34,211,238,.3)"
        onclick="openTreeModal('${leader.id}')">🌳 Hierarquia</button>

        onclick="openTreeModal('${leader.id}')">🌳 Hierarquia</button>

  return `
  <div class="leader-card nivel-${nivel}${isHighlight?' highlight':''}${temAptPendente?' apt-pendente':''}">

      <div class="leader-info">
        <div class="leader-name">${leader.name}</div>

// ★ MODAL ÁRVORE HIERÁRQUICA
// ════════════════════════════════════════════════════════
function openTreeModal(leaderId) {
  _treeRootId = leaderId;
  _treePath   = [];
  renderTreeModal(leaderId);
  document.getElementById('modal-tree-overlay').classList.add('open');
}

function closeTreeModal() {
  document.getElementById('modal-tree-overlay').classList.remove('open');
  _treeRootId = null;
  _treePath   = [];
}

function renderTreeModal(leaderId) {
  const store  = _store;
  const leader = store?.users?.[leaderId];
  if (!leader) return;

  const meta = NIVEL_META[leader.nivel||'lider']||NIVEL_META.lider;
  const ini  = leader.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

  // Atualiza cabeçalho
  document.getElementById('tree-modal-name').textContent = leader.name;
  document.getElementById('tree-modal-sub').textContent  = `${meta.emoji} ${meta.label} · Árvore de responsabilidades`;
  const headerAvatar = document.getElementById('tree-root-avatar-header');
  headerAvatar.innerHTML = leader.foto
    ? `<img src="${leader.foto}" style="width:46px;height:46px;border-radius:50%;object-fit:cover">`
    : ini;
  headerAvatar.style.background = leader.foto ? 'transparent' : `linear-gradient(135deg,${meta.cor},${meta.cor}99)`;

  // Breadcrumb
  renderTreeBreadcrumb(leaderId);

  // Corpo da árvore
  renderTreeBody(leaderId);
}

function renderTreeBreadcrumb(currentId) {
  const bc = document.getElementById('tree-breadcrumb');
  if (!_treePath.length) { bc.innerHTML = ''; return; }

  const parts = _treePath.map((node, i) => {
    const isLast = i === _treePath.length - 1;
    if (isLast) return `<span class="bc-item current">${node.name}</span>`;
    return `<span class="bc-item" onclick="navigateTreeTo('${node.id}', ${i})">${node.name}</span>
            <span class="bc-sep">›</span>`;
  });

  // Adiciona a raiz no início se não estiver no path
  const rootLeader = _store?.users?.[_treeRootId];
  if (rootLeader && _treePath[0]?.id !== _treeRootId) {
    bc.innerHTML = `<span class="bc-item" onclick="navigateTreeTo('${_treeRootId}', -1)">${rootLeader.name}</span>
                    <span class="bc-sep">›</span>` + parts.join('');
  } else {
    bc.innerHTML = parts.join('');
  }
}

function navigateTreeTo(id, pathIdx) {
  if (pathIdx === -1) {
    _treePath = [];
  } else {
    _treePath = _treePath.slice(0, pathIdx + 1);
  }
  renderTreeModal(id);
}

function navigateTreeDown(leaderId) {
  const leader = _store?.users?.[leaderId];
  if (!leader) return;
  _treePath.push({ id: leaderId, name: leader.name });
  renderTreeModal(leaderId);
}

function renderTreeBody(leaderId) {
  const store  = _store;
  const leader = store?.users?.[leaderId];
  const body   = document.getElementById('tree-modal-body');
  if (!leader) { body.innerHTML = '<div class="tree-empty"><div class="tree-empty-icon">🔍</div><p>Líder não encontrado.</p></div>'; return; }

  const allLeaders = Object.values(store.users||{})
    .filter(u => u.id !== ADMIN_ID && u.nivel !== 'admin_master');
  const allEmps    = store.employees || [];

  const meta        = NIVEL_META[leader.nivel||'lider']||NIVEL_META.lider;
  const ini         = leader.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  const team        = getTeamEmps(leader, allEmps);
  const subordinados= getSubordinados(leader, allLeaders);
  const totalTime   = getTeamTotal(leader, store);
  const avgScore    = team.length ? Math.round(team.reduce((s,e)=>s+calcScore(e),0)/team.length) : 0;
  const promos      = team.filter(e=>calcScore(e)>=85).length;
  const riscos      = team.filter(e=>calcScore(e)<55).length;

  let html = '';

  // ── Nó raiz ──
  html += `
  <div class="tree-root-card">
    <div class="tree-root-avatar" style="background:${leader.foto?'transparent':`linear-gradient(135deg,${meta.cor},${meta.cor}88)`}">
      ${leader.foto?`<img src="${leader.foto}" style="width:46px;height:46px;border-radius:50%;object-fit:cover">`:ini}
    </div>
    <div class="tree-root-info">
      <div class="tree-root-name">${leader.name}</div>
      <div class="tree-root-meta">${meta.emoji} ${meta.label}${leader.perfil?.funcao?' · '+leader.perfil.funcao:''}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div style="font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--accent2)">${totalTime}</div>
      <div style="font-size:10px;color:var(--muted)">sob responsabilidade</div>
    </div>
  </div>`;

  // ── Pills de estatísticas ──
  if (team.length) {
    html += `
    <div class="tree-stats-row">
      <div class="tree-stat-pill">👥 ${team.length} operac.</div>
      <div class="tree-stat-pill" style="color:var(--accent2)">⭐ Score médio: ${avgScore}</div>
      ${promos ? `<div class="tree-stat-pill" style="color:var(--green)">🏆 ${promos} promoção</div>` : ''}
      ${riscos ? `<div class="tree-stat-pill" style="color:var(--red)">🔴 ${riscos} em risco</div>` : ''}
    </div>`;
  }

  // ── Subordinados líderes (clicáveis) ──
  if (subordinados.length) {
    html += `<div class="tree-connector">
      <div class="tree-connector-label">👔 Líderes subordinados (${subordinados.length})</div>`;

    subordinados.sort((a,b) => ORDEM_IDX.indexOf(b.nivel||'lider') - ORDEM_IDX.indexOf(a.nivel||'lider'))
      .forEach(sub => {
        const subMeta  = NIVEL_META[sub.nivel||'lider']||NIVEL_META.lider;
        const subIni   = sub.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
        const subTeam  = getTeamEmps(sub, allEmps);
        const subTotal = getTeamTotal(sub, store);

        html += `
        <div class="tree-sub-card clickable" onclick="navigateTreeDown('${sub.id}')">
          <div class="tree-sub-avatar" style="background:${sub.foto?'transparent':`linear-gradient(135deg,${subMeta.cor},${subMeta.cor}88)`}">
            ${sub.foto?`<img src="${sub.foto}" style="width:34px;height:34px;border-radius:50%;object-fit:cover">`:subIni}
          </div>
          <div class="tree-sub-info">
            <div class="tree-sub-name">${sub.name}</div>
            <div class="tree-sub-meta">${subMeta.emoji} ${subMeta.label}${sub.perfil?.funcao?' · '+sub.perfil.funcao:''}</div>
          </div>
          <div class="tree-sub-stats">
            <span class="tree-sub-stat" style="color:var(--muted)">${subTotal} pessoas</span>
          </div>
          <span class="tree-sub-badge" style="background:${subMeta.cor}18;color:${subMeta.cor};border:1px solid ${subMeta.cor}33">
            ${subMeta.emoji} ${subMeta.label}
          </span>
        </div>`;
      });

    html += `</div>`;
  }

  // ── Funcionários operacionais ──
  if (team.length) {
    html += `<div class="tree-connector">
      <div class="tree-connector-label">👷 Funcionários operacionais (${team.length})</div>
      <div class="tree-emp-cards">`;

    team.forEach(emp => {
      const empIni = emp.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
      const score  = calcScore(emp);
      const scoreColor = score>=85?'#34d399':score>=70?'#4f8ef7':score>=55?'#fbbf24':'#f87171';
      html += `
        <div class="tree-emp-card">
          <div class="tree-emp-avatar">${emp.foto?`<img src="${emp.foto}" style="width:28px;height:28px;border-radius:50%;object-fit:cover">`:empIni}</div>
          <div class="tree-emp-info">
            <div class="tree-emp-name">${emp.name}</div>
            <div class="tree-emp-meta">${emp.role||emp.dept||'—'}</div>
          </div>
          <span style="font-family:var(--font-head);font-size:14px;font-weight:800;color:${scoreColor};flex-shrink:0">${score}</span>
        </div>`;
    });

    html += `</div></div>`;
  }

  // Estado vazio
  if (!subordinados.length && !team.length) {
    html += `
    <div class="tree-empty">
      <div class="tree-empty-icon">🏝️</div>
      <p style="font-size:14px;margin-bottom:6px">Nenhuma equipe ainda</p>
      <p style="font-size:12px;color:var(--muted)">Este líder ainda não tem subordinados ou funcionários associados.</p>
    </div>`;
  }

  body.innerHTML = html;
}

// SALVAR LÍDER
// ════════════════════════════════════════════════════════
async function saveLeader() {
  const name   = document.getElementById('f-name').value.trim();
  const id     = document.getElementById('f-id').value.trim();
  const nivel  = document.getElementById('f-nivel').value;
  const editId = document.getElementById('f-edit-id').value;

  if (!name)             { showToast('⚠️ Nome é obrigatório.','warn'); return; }
  if (!editId && !id)    { showToast('⚠️ ID de acesso é obrigatório.','warn'); return; }

  const store = await getStore();
  const pass  = document.getElementById('f-pass').value;
  if (!editId && pass.length<6) { showToast('⚠️ Senha com mínimo 6 caracteres.','warn'); return; }
  if (!editId && store.users[id]) { showToast('❌ Este ID já está cadastrado.','error'); return; }

  const depts   = [...document.querySelectorAll('#f-depts-list input:checked')].map(c=>c.value);
  const filiais = [...document.querySelectorAll('#f-filiais-list input:checked')].map(c=>c.value);
  const turnos  = [...document.querySelectorAll('#f-turnos-list input:checked')].map(c=>c.value);

  const perfil = { filiais, turnos, filial:filiais[0]||'', turno:turnos[0]||'', funcao:document.getElementById('f-role').value, depts };

  if (editId) {
    if (!store.users[editId]) { showToast('❌ Usuário não encontrado.','error'); return; }
    const fotoLider = document.getElementById('f-foto-lider').value||store.users[editId].foto||null;
    store.users[editId] = { ...store.users[editId], name, nivel, perfil, foto:fotoLider };
    await registrarLog('editou','Líderes',`Editou: <strong>${name}</strong>`);
    showToast('✅ Líder atualizado!');
  } else {
    const fotoLiderNovo = document.getElementById('f-foto-lider').value||null;
    store.users[id] = { id, name, pass, nivel, setor:depts[0]||'', perfil, foto:fotoLiderNovo };
    await registrarLog('criou','Líderes',`Novo líder: <strong>${name}</strong> (${nivel})`);
    showToast('✅ Líder cadastrado!');
  }

  await saveStore(store);
  _store = null;
  closeModal();
  renderLeaders();
}

  showToast('✅ Senha redefinida!');
}

function renderCircularOrgChart(leaderId) {
  const store  = _store;
  const leader = store?.users?.[leaderId];
  if (!leader) return;

  // ── Cabeçalho do modal ──
  const lm  = NIVEL_META[leader.nivel||'lider'] || NIVEL_META.lider;
  const ini = leader.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  const hAv = document.getElementById('org-modal-avatar');
  hAv.style.background = leader.foto ? 'transparent' : `linear-gradient(135deg,${lm.cor},${lm.cor}88)`;
  hAv.innerHTML = leader.foto
    ? `<img src="${leader.foto}" style="width:46px;height:46px;border-radius:50%;object-fit:cover">` : ini;
  document.getElementById('org-modal-name').textContent = leader.name;
  document.getElementById('org-modal-sub').textContent  = `${lm.emoji} ${lm.label} · Árvore hierárquica`;

  // ── Dados ──
  const allLeaders = Object.values(store.users||{}).filter(u => u.id !== ADMIN_ID && u.nivel !== 'admin_master');
  const allEmps    = store.employees || [];
  const subs       = getSubordinados(leader, allLeaders);
  const rootTeam   = getTeamEmps(leader, allEmps);

  // Subtrees: cada líder subordinado + seus funcionários (max 8)
  const subTrees = subs.map(sub => ({
    leader: sub,
    emps: getTeamEmps(sub, allEmps).slice(0, 8)
  }));

  // Funcionários diretos do root (excluindo os que já estão sob um sub-líder)
  const subEmpIds  = new Set(subTrees.flatMap(st => st.emps.map(e => e.id)));
  const directEmps = rootTeam.filter(e => !subEmpIds.has(e.id)).slice(0, 10);

  // ── Constantes de layout ──
  const R    = 33;   // raio das bolhas
  const RR   = 42;   // raio da bolha root
  const SLOT = 82;   // largura horizontal por nó
  const VG   = 100;  // distância vertical entre centros de nível
  const PAD  = 50;   // padding horizontal

  // Largura de cada subtree = max(1, emps) × SLOT
  const stW = st => Math.max(1, st.emps.length) * SLOT;

  // Largura total dos sub-líderes
  const subsW = subTrees.length
    ? subTrees.reduce((s, st) => s + stW(st), 0) + (subTrees.length - 1) * 12
    : 0;
  const dirW  = directEmps.length * SLOT;
  const svgW  = Math.max(520, subsW, dirW) + PAD * 2;
  const CX    = svgW / 2;

  // Níveis Y (centro de cada bolha)
  const Y0  = 16 + RR;
  const Y1  = Y0 + VG;
  const Y2  = Y1 + VG;

  const hasL1  = subTrees.length > 0;
  const hasL2  = subTrees.some(st => st.emps.length > 0);
  const hasDr  = directEmps.length > 0;

  // Altura do SVG
  let svgH = Y0 + RR + 55;
  if (hasL1)          svgH = Y1 + R + 55;
  if (hasL2 || hasDr) svgH = Y2 + R + 55;

  // ── Defs ──
  const mkClip = (id,r) => `<clipPath id="${id}"><circle cx="0" cy="0" r="${r}"/></clipPath>`;
  const mkGrad = (id,c)  => `<radialGradient id="${id}" cx="35%" cy="30%"><stop offset="0%" stop-color="${c}"/><stop offset="100%" stop-color="${c}88"/></radialGradient>`;

  let defs = '<defs>';
  defs += mkClip('td-cr', RR-3);
  defs += mkGrad('td-gr', lm.cor);
  defs += mkGrad('td-ge', '#4f8ef7');  // gradiente para employees
  subTrees.forEach((st, i) => {
    const m = NIVEL_META[st.leader.nivel||'lider']||NIVEL_META.lider;
    defs += mkClip(`td-cl${i}`, R-3);
    defs += mkGrad(`td-gl${i}`, m.cor);
    st.emps.forEach((_, j) => defs += mkClip(`td-ce${i}-${j}`, R-3));
  });
  directEmps.forEach((_, i) => defs += mkClip(`td-cd${i}`, R-3));
  defs += `<filter id="td-drop" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feFlood flood-color="${lm.cor}" flood-opacity="0.4" result="color"/>
    <feComposite in="color" in2="blur" operator="in" result="shadow"/>
    <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
  </filter>`;
  defs += '</defs>';

  let p = [defs];  // parts

  // ── Helpers ──

  // Bolha genérica — desenhada em coordenadas locais via <g transform="translate">
  function node(x, y, person, clipId, fillGrad, strokeColor, isRoot=false) {
    const r   = isRoot ? RR : R;
    const fs  = isRoot ? 18 : 13;
    const ini = person.name.split(' ').map(c=>c[0]).slice(0,2).join('').toUpperCase();
    const fn  = person.name.split(' ')[0]||'';
    const ln  = person.name.split(' ')[1] ? person.name.split(' ')[1][0]+'.' : '';
    const dn  = (fn.slice(0,9)+(ln?' '+ln:'')).slice(0,12);
    const rl  = (isRoot
      ? (lm.emoji+' '+lm.label)
      : (NIVEL_META[person.nivel||'']?.label || person.role || person.dept || '')
    ).slice(0,20);

    let g = `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">`;
    // Halo externo
    g += `<circle cx="0" cy="0" r="${r+6}" fill="${strokeColor}14"/>`;
    // Anel de borda colorido
    g += `<circle cx="0" cy="0" r="${r+2}" fill="none" stroke="${strokeColor}55" stroke-width="1.5"/>`;
    // Bolha principal
    g += `<circle cx="0" cy="0" r="${r}" fill="${fillGrad}" stroke="${strokeColor}" stroke-width="${isRoot?3:2}"${isRoot?' filter="url(#td-drop)"':''}/>`;
    // Foto ou iniciais
    if (person.foto) {
      g += `<image href="${person.foto}" x="-${r-3}" y="-${r-3}" width="${(r-3)*2}" height="${(r-3)*2}" clip-path="url(#${clipId})"/>`;
    } else {
      g += `<text x="0" y="${Math.round(fs*0.38)}" text-anchor="middle" font-family="Syne,sans-serif" font-size="${fs}" font-weight="800" fill="white">${ini}</text>`;
    }
    // Nome
    g += `<text x="0" y="${r+15}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="${isRoot?12:10}" font-weight="700" fill="#e2e8f0">${dn}</text>`;
    // Cargo
    if (rl) g += `<text x="0" y="${r+27}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9" fill="#94a3b8">${rl}</text>`;
    g += '</g>';
    return g;
  }

  // Linha bezier entre dois pontos (parte de baixo do pai → parte de cima do filho)
  function link(x1, y1b, x2, y2t, color) {
    const my = (y1b + y2t) / 2;
    return `<path d="M${x1.toFixed(1)},${y1b.toFixed(1)} C${x1.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2t.toFixed(1)}" fill="none" stroke="${color}55" stroke-width="1.5" stroke-dasharray="5,4"/>`;
  }

  // Barra horizontal conectando irmãos
  function hBar(x1, x2, y, color) {
    return `<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}33" stroke-width="1.5"/>`;
  }

  // ── ROOT ──
  p.push(node(CX, Y0, leader, 'td-cr', `url(#td-gr)`, lm.cor, true));

  // ── SUB-LÍDERES (nível 1) ──
  if (hasL1) {
    // Calcular posições X de cada sub-líder
    const totalSubsW = subTrees.reduce((s,st)=>s+stW(st),0) + (subTrees.length-1)*12;
    let cx = CX - totalSubsW/2;
    const subXs = [];

    subTrees.forEach((st, i) => {
      const w = stW(st);
      subXs.push(cx + w/2);
      cx += w + 12;
    });

    // Barra horizontal entre sub-líderes (se >1)
    if (subTrees.length > 1) {
      const barY = Y0 + (Y1-Y0)/2;
      p.push(hBar(subXs[0], subXs[subXs.length-1], barY, lm.cor));
      // Pinos verticais da barra até cada sub-líder
      subXs.forEach(sx => {
        p.push(`<line x1="${sx.toFixed(1)}" y1="${(Y0+(Y1-Y0)/2).toFixed(1)}" x2="${sx.toFixed(1)}" y2="${(Y1-R-4).toFixed(1)}" stroke="${lm.cor}44" stroke-width="1.5" stroke-dasharray="4,3"/>`);
      });
      // Pino vertical do root à barra
      p.push(`<line x1="${CX.toFixed(1)}" y1="${(Y0+RR+4).toFixed(1)}" x2="${CX.toFixed(1)}" y2="${(Y0+(Y1-Y0)/2).toFixed(1)}" stroke="${lm.cor}44" stroke-width="1.5" stroke-dasharray="4,3"/>`);
    } else {
      // Só 1: linha direta
      p.push(link(CX, Y0+RR+4, subXs[0], Y1-R-4, lm.cor));
    }

    // Calcular de novo o leftX de cada subtree para os employees
    let leftX = CX - totalSubsW/2;
    subTrees.forEach((st, i) => {
      const sx = subXs[i];
      const m  = NIVEL_META[st.leader.nivel||'lider']||NIVEL_META.lider;

      // Nó do sub-líder
      p.push(node(sx, Y1, st.leader, `td-cl${i}`, `url(#td-gl${i})`, m.cor));

      // Funcionários deste sub-líder
      if (st.emps.length > 0) {
        const empXs = st.emps.map((_, j) => leftX + j*SLOT + SLOT/2);

        // Barra horizontal entre employees (se >1)
        if (st.emps.length > 1) {
          const barY = Y1 + (Y2-Y1)/2;
          p.push(hBar(empXs[0], empXs[empXs.length-1], barY, m.cor));
          empXs.forEach(ex => {
            p.push(`<line x1="${ex.toFixed(1)}" y1="${barY.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${(Y2-R-4).toFixed(1)}" stroke="${m.cor}44" stroke-width="1.5" stroke-dasharray="4,3"/>`);
          });
          p.push(`<line x1="${sx.toFixed(1)}" y1="${(Y1+R+4).toFixed(1)}" x2="${sx.toFixed(1)}" y2="${barY.toFixed(1)}" stroke="${m.cor}44" stroke-width="1.5" stroke-dasharray="4,3"/>`);
        } else {
          p.push(link(sx, Y1+R+4, empXs[0], Y2-R-4, m.cor));
        }

        st.emps.forEach((emp, j) => {
          p.push(node(empXs[j], Y2, emp, `td-ce${i}-${j}`, `url(#td-ge)`, '#4f8ef7'));
        });
      }

      leftX += stW(st) + 12;
    });
  }

  // ── FUNCIONÁRIOS DIRETOS DO ROOT (sem sub-líder) ──
  if (hasDr) {
    const dY     = hasL1 ? Y2 : Y1;
    const dLeft  = CX - directEmps.length * SLOT / 2;
    const dEmpXs = directEmps.map((_, i) => dLeft + i*SLOT + SLOT/2);

    if (directEmps.length > 1) {
      const barY = Y0 + (dY-Y0)/2;
      p.push(hBar(dEmpXs[0], dEmpXs[dEmpXs.length-1], barY, '#4f8ef7'));
      dEmpXs.forEach(ex => {
        p.push(`<line x1="${ex.toFixed(1)}" y1="${barY.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${(dY-R-4).toFixed(1)}" stroke="#4f8ef744" stroke-width="1.5" stroke-dasharray="4,3"/>`);
      });
      p.push(`<line x1="${CX.toFixed(1)}" y1="${(Y0+RR+4).toFixed(1)}" x2="${CX.toFixed(1)}" y2="${barY.toFixed(1)}" stroke="#4f8ef744" stroke-width="1.5" stroke-dasharray="4,3"/>`);
    } else {
      p.push(link(CX, Y0+RR+4, dEmpXs[0], dY-R-4, '#4f8ef7'));
    }

    directEmps.forEach((emp, i) => {
      p.push(node(dEmpXs[i], dY, emp, `td-cd${i}`, `url(#td-ge)`, '#4f8ef7'));
    });
  }

  // ── Estado vazio ──
  if (!hasL1 && !hasDr) {
    p.push(`<text x="${CX}" y="${Y0+RR+50}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="13" fill="#94a3b8">Sem subordinados cadastrados</text>`);
  }

  const svg = `<svg viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg" width="${svgW}" height="${svgH}">${p.join('')}</svg>`;
  document.getElementById('org-chart-container').innerHTML = svg;
}

// ── Foto do líder ────────────────────────────────────
function processarFotoLider(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 80; canvas.height = 80;
      const ctx  = canvas.getContext('2d');
      const size = Math.min(img.width,img.height);
      const sx   = (img.width-size)/2, sy=(img.height-size)/2;
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 80, 80);
      const base64 = canvas.toDataURL('image/jpeg', 0.65);
      document.getElementById('f-foto-lider').value = base64;
      document.getElementById('foto-preview-lider').innerHTML = `<img src="${base64}" alt="foto">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function removerFotoLider() {
  document.getElementById('f-foto-lider').value = '';
  const nm  = document.getElementById('f-name').value.trim();
  const ini = nm.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'?';
  document.getElementById('foto-preview-lider').innerHTML = `<span id="foto-ini-lider">${ini}</span>`;
}
</script>
