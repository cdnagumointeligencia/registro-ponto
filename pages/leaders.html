<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organograma · RH Nagumo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sidebar.css">
<link rel="stylesheet" href="../light-theme.css">
<link rel="stylesheet" href="../responsive.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>
<script src="../permissions.js"></script>
<script src="../shared.js"></script>
<style>
/* ══════════════════════════════════════════════
   VARIÁVEIS
══════════════════════════════════════════════ */
:root {
  --bg:#0b0d14; --surface:#12151f; --surface2:#1a1e2e; --surface3:#222638;
  --border:#2a2f45; --accent:#4f8ef7; --accent2:#a78bfa;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171; --orange:#fb923c;
  --cyan:#22d3ee; --text:#ffffff; --muted:#94a3b8;
  --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  --sidebar-w:220px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; }
body { background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; }
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:var(--surface); }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }

/* ══ MAIN ══ */
.main { margin-left:var(--sidebar-w); padding:24px 28px; min-height:100vh; }
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; flex-wrap:wrap; gap:12px;
}
.page-title { font-family:var(--font-head); font-size:28px; font-weight:800; letter-spacing:-1.5px; }

/* ══ BOTÕES ══ */
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:9px 16px;
  border-radius:8px; border:none; font-family:var(--font-body);
  font-size:12px; font-weight:600; cursor:pointer; transition:all .2s;
}
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:#3a7ae0; transform:translateY(-1px); box-shadow:0 4px 16px rgba(79,142,247,.35); }
.btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface3); }
.btn-danger { background:rgba(248,113,113,.12); color:var(--red); border:1px solid rgba(248,113,113,.25); }
.btn-danger:hover { background:rgba(248,113,113,.22); }
.btn-sm { padding:5px 11px; font-size:11px; border-radius:7px; }

/* ══ FILTER BAR ══ */
.filter-bar { margin-bottom:22px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.leader-select-wrap { position:relative; }
.leader-select-wrap::after {
  content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:12px; pointer-events:none;
}
.leader-select {
  appearance:none; background:var(--surface); border:1.5px solid var(--border);
  border-radius:10px; color:var(--text); font-family:var(--font-body);
  font-size:13px; font-weight:500; padding:9px 34px 9px 14px;
  outline:none; cursor:pointer; transition:border-color .2s, box-shadow .2s;
  min-width:240px;
}
.leader-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,142,247,.12); }
.leader-select option { background:var(--surface2); }

.filter-count {
  font-size:12px; font-weight:600; color:var(--muted);
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:6px 12px;
}

/* ══ HIERARQUIA SEPARADORES ══ */
.hier-sep {
  grid-column:1/-1; display:flex; align-items:center; gap:12px;
  margin-top:8px; margin-bottom:2px;
}
.hier-sep:first-child { margin-top:0; }
.hier-label {
  font-family:var(--font-head); font-size:10px; font-weight:800;
  text-transform:uppercase; letter-spacing:2px; white-space:nowrap;
  padding:4px 13px; border-radius:20px;
}
.hier-line { flex:1; height:1px; background:var(--border); opacity:.5; }
.hier-count { font-size:11px; color:var(--muted); white-space:nowrap; }

.hier-label.diretoria   { background:rgba(251,146,60,.12);  color:#fb923c; border:1px solid rgba(251,146,60,.3);  }
.hier-label.gerencia    { background:rgba(251,191,36,.12);  color:#fbbf24; border:1px solid rgba(251,191,36,.3);  }
.hier-label.coordenacao { background:rgba(167,139,250,.12); color:#a78bfa; border:1px solid rgba(167,139,250,.3); }
.hier-label.encarregado { background:rgba(34,211,238,.12);  color:#22d3ee; border:1px solid rgba(34,211,238,.3);  }
.hier-label.lider       { background:rgba(79,142,247,.12);  color:#4f8ef7; border:1px solid rgba(79,142,247,.3);  }

/* ══ LEADERS GRID ══ */
.leaders-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
  gap:16px;
}

/* ══ LEADER CARD — novo design ══ */
.lcard {
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s, box-shadow .2s, border-color .2s;
  display:flex; flex-direction:column;
  position:relative;
}
.lcard:hover { transform:translateY(-3px); }

/* Faixas de cor por nível */
.lcard.lvl-diretoria   { border-color:rgba(251,146,60,.5); }
.lcard.lvl-gerencia    { border-color:rgba(251,191,36,.5); }
.lcard.lvl-coordenacao { border-color:rgba(167,139,250,.5); }
.lcard.lvl-encarregado { border-color:rgba(34,211,238,.5); }
.lcard.lvl-lider       { border-color:rgba(79,142,247,.4); }

.lcard.lvl-diretoria:hover   { border-color:#fb923c; box-shadow:0 8px 32px rgba(251,146,60,.2); }
.lcard.lvl-gerencia:hover    { border-color:#fbbf24; box-shadow:0 8px 32px rgba(251,191,36,.2); }
.lcard.lvl-coordenacao:hover { border-color:#a78bfa; box-shadow:0 8px 32px rgba(167,139,250,.2); }
.lcard.lvl-encarregado:hover { border-color:#22d3ee; box-shadow:0 8px 32px rgba(34,211,238,.2); }
.lcard.lvl-lider:hover       { border-color:#4f8ef7; box-shadow:0 8px 32px rgba(79,142,247,.2); }

/* Header colorido */
.lcard-header {
  position:relative; height:58px; flex-shrink:0;
}
.lcard-header-bg {
  position:absolute; inset:0;
  opacity:.18;
}
.lcard.lvl-diretoria   .lcard-header-bg { background:linear-gradient(135deg,#fb923c,#ef4444); }
.lcard.lvl-gerencia    .lcard-header-bg { background:linear-gradient(135deg,#fbbf24,#f59e0b); }
.lcard.lvl-coordenacao .lcard-header-bg { background:linear-gradient(135deg,#a78bfa,#7c3aed); }
.lcard.lvl-encarregado .lcard-header-bg { background:linear-gradient(135deg,#22d3ee,#0891b2); }
.lcard.lvl-lider       .lcard-header-bg { background:linear-gradient(135deg,#4f8ef7,#3b6fd4); }

/* Stripe top */
.lcard-stripe {
  position:absolute; top:0; left:0; right:0; height:3px;
}
.lcard.lvl-diretoria   .lcard-stripe { background:linear-gradient(90deg,#fb923c,#ef4444); }
.lcard.lvl-gerencia    .lcard-stripe { background:linear-gradient(90deg,#fbbf24,#f59e0b); }
.lcard.lvl-coordenacao .lcard-stripe { background:linear-gradient(90deg,#a78bfa,#7c3aed); }
.lcard.lvl-encarregado .lcard-stripe { background:linear-gradient(90deg,#22d3ee,#0891b2); }
.lcard.lvl-lider       .lcard-stripe { background:linear-gradient(90deg,#4f8ef7,#3b6fd4); }

/* Nível badge no header */
.lcard-lvl-badge {
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:10px; font-weight:700; padding:3px 10px; border-radius:20px;
  backdrop-filter:blur(4px);
}

/* ── Identidade ── */
.lcard-identity {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px 12px;
}
.lcard-avatar {
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:17px; font-weight:800; color:#fff;
  border:2.5px solid var(--border); overflow:hidden;
  transition:border-color .2s;
}
.lcard:hover .lcard-avatar { border-color:transparent; }
.lcard-info { flex:1; min-width:0; }
.lcard-name {
  font-family:var(--font-head); font-size:16px; font-weight:800; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.4px;
}
.lcard-role { font-size:11.5px; color:var(--muted); margin-top:3px; }

/* ── Metrics strip ── */
.lcard-metrics {
  display:flex; gap:0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
}
.lcard-metric {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 8px; position:relative;
}
.lcard-metric + .lcard-metric::before {
  content:''; position:absolute; left:0; top:20%; bottom:20%;
  width:1px; background:var(--border);
}
.lcard-metric-val {
  font-family:var(--font-head); font-size:20px; font-weight:800; letter-spacing:-1px; line-height:1;
}
.lcard-metric-val.v-team   { color:var(--text); }
.lcard-metric-val.v-desemp { color:var(--green); }
.lcard-metric-val.v-score  { color:var(--accent2); }
.lcard-metric-lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-top:4px; }

/* ── Stats row ── */
.lcard-stats { display:flex; gap:6px; padding:10px 16px; flex-wrap:wrap; }
.lcard-stat {
  flex:1; min-width:80px; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px;
}
.lcard-stat-lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-bottom:3px; }
.lcard-stat-val { font-family:var(--font-head); font-size:17px; font-weight:800; letter-spacing:-1px; }
.stat-green { color:var(--green); }
.stat-red   { color:var(--red);   }
.stat-warn  { color:var(--yellow);}
.stat-text  { color:var(--text);  }

/* ── Team avatars ── */
.lcard-team { display:flex; align-items:center; gap:5px; padding:0 16px 12px; flex-wrap:wrap; }
.lcard-team-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); width:100%; margin-bottom:6px; }
.av-bubble {
  width:28px; height:28px; border-radius:50%; background:var(--surface3); border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:800; color:var(--muted); font-family:var(--font-head);
}
.av-more {
  padding:0 7px; height:28px; border-radius:14px; background:var(--surface3); border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--muted);
}

/* ── Tags (filial/turno) ── */
.lcard-tags { display:flex; gap:5px; padding:0 16px 12px; flex-wrap:wrap; }
.tag {
  padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700;
  white-space:nowrap;
}
.tag-filial  { background:rgba(79,142,247,.1);  color:var(--accent);  border:1px solid rgba(79,142,247,.2);  }
.tag-turno   { background:rgba(167,139,250,.1); color:var(--accent2); border:1px solid rgba(167,139,250,.2); }
.tag-promo   { background:rgba(52,211,153,.1);  color:var(--green);   border:1px solid rgba(52,211,153,.2);  }
.tag-risk    { background:rgba(248,113,113,.1); color:var(--red);     border:1px solid rgba(248,113,113,.2); }

/* ── Apt banner ── */
.lcard-apt {
  display:flex; align-items:center; gap:7px;
  margin:0 16px 10px; padding:7px 12px; border-radius:8px;
  background:rgba(244,114,182,.1); border:1px solid rgba(244,114,182,.3);
  font-size:11px; font-weight:700; color:#f472b6; cursor:pointer;
  transition:background .15s;
}
.lcard-apt:hover { background:rgba(244,114,182,.18); }

/* ── Org hint ── */
.lcard-org-hint {
  display:flex; align-items:center; justify-content:center; gap:7px;
  margin:0 16px 12px; padding:7px 12px; border-radius:8px;
  background:rgba(79,142,247,.06); border:1px solid rgba(79,142,247,.15);
  font-size:11px; font-weight:600; color:var(--muted);
  transition:background .15s, color .15s, border-color .15s;
}
.lcard:hover .lcard-org-hint {
  background:rgba(79,142,247,.14); color:var(--accent); border-color:rgba(79,142,247,.35);
}

/* ── Admin actions ── */
.lcard-actions {
  display:flex; gap:6px; padding:0 16px 14px; flex-wrap:wrap;
}
.lcard-actions .btn { font-size:11px; padding:5px 10px; }

/* ── Apt pendente animation ── */
.lcard.apt-pendente { animation:card-apt-pulse 2.8s ease-in-out infinite; }
.lcard.apt-pendente .lcard-stripe { animation:stripe-flow 1.8s linear infinite; background-size:200% !important; }
@keyframes card-apt-pulse {
  0%  { box-shadow:0 0 0 0 rgba(244,114,182,.5); }
  60% { box-shadow:0 0 0 10px rgba(244,114,182,.0); }
  100%{ box-shadow:0 0 0 0 rgba(244,114,182,.0); }
}
@keyframes stripe-flow { 0%{background-position:0%} 100%{background-position:200%} }

/* ══ ORGANOGRAMA MODAL ══ */
.ov {
  position:fixed; inset:0; background:rgba(0,0,0,.78);
  backdrop-filter:blur(5px); z-index:300;
  display:none; align-items:center; justify-content:center; padding:16px;
}
.ov.open { display:flex; }

.org-modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; width:min(1100px, 97vw);
  height:min(700px, 94vh);
  display:flex; flex-direction:column;
  animation:fadeUp .28s ease; overflow:hidden;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

.org-hdr {
  display:flex; align-items:center; gap:14px;
  padding:16px 22px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.org-hdr-av {
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:15px; font-weight:800; color:#fff; overflow:hidden;
}
.org-hdr-name { font-family:var(--font-head); font-size:17px; font-weight:800; color:var(--text); }
.org-hdr-sub  { font-size:11px; color:var(--muted); margin-top:2px; }
.org-close {
  margin-left:auto; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:7px 14px; color:var(--muted); font-size:12px;
  font-weight:600; cursor:pointer; transition:all .15s; font-family:var(--font-body);
}
.org-close:hover { border-color:var(--red); color:var(--red); }

.org-hint-bar {
  padding:6px 22px; font-size:10px; color:var(--muted);
  background:var(--surface2); border-bottom:1px solid var(--border);
  flex-shrink:0;
}

/* ── Painel de colunas ── */
#org-panels {
  flex:1; display:flex; flex-direction:row; align-items:stretch;
  overflow-x:auto; overflow-y:hidden;
  background:var(--border); gap:1px;
}
.org-panel {
  width:258px; min-width:258px; background:var(--surface);
  display:flex; flex-direction:column; flex-shrink:0;
}
.org-panel-hdr {
  padding:13px 14px 11px; background:var(--surface2);
  display:flex; align-items:center; gap:10px;
  flex-shrink:0; border-bottom:2px solid var(--border);
}
.org-panel-av {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:12px; font-weight:800; color:#fff; overflow:hidden;
}
.org-panel-nm { font-family:var(--font-head); font-size:12px; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.org-panel-rl { font-size:9.5px; color:var(--muted); margin-top:1px; }
.org-panel-body { flex:1; overflow-y:auto; }

.org-sec-lbl {
  font-size:9px; font-weight:700; text-transform:uppercase;
  letter-spacing:1.5px; color:var(--muted); padding:10px 14px 5px; user-select:none;
}

.org-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 10px 9px 11px; cursor:pointer;
  transition:background .12s; border-left:3px solid transparent;
}
.org-item:hover { background:var(--surface2); }
.org-item.org-emp { cursor:default; border-left-color:rgba(79,142,247,.35); }
.org-item.org-emp:hover { background:transparent; }

.org-item-av {
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:10px; font-weight:800;
  color:#fff; overflow:hidden;
}
.org-item-av.emp-av { background:linear-gradient(135deg,#4f8ef7,#3b6fd4); }
.org-item-info { flex:1; min-width:0; }
.org-item-nm { font-size:12px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.org-item-rl { font-size:9.5px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.org-item-cnt { font-size:9px; color:var(--muted); margin-top:2px; }
.org-item-arr { font-size:20px; color:var(--muted); flex-shrink:0; line-height:1; transition:all .12s; }
.org-item:hover .org-item-arr { color:var(--accent); transform:translateX(2px); }
.org-item-arr.sel { color:var(--accent); }

/* ══ MODAL GENÉRICO ══ */
.ov2 {
  position:fixed; inset:0; background:rgba(0,0,0,.72);
  backdrop-filter:blur(4px); z-index:400;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.ov2.open { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:28px; width:500px;
  max-width:95vw; max-height:90vh; overflow-y:auto;
  animation:fadeUp .25s ease;
}
.modal-wide { width:560px; }
.modal-title { font-family:var(--font-head); font-size:18px; font-weight:800; margin-bottom:20px; color:var(--text); }
.modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group.full { grid-column:1/-1; }
.form-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.form-input {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  color:var(--text); font-family:var(--font-body); font-size:13px;
  padding:9px 11px; outline:none; transition:border-color .2s;
}
.form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,142,247,.1); }
.form-input option { background:var(--surface2); }

/* ── Foto upload ── */
.foto-wrap { display:flex; align-items:center; gap:14px; margin-bottom:4px; }
.foto-prev {
  width:64px; height:64px; border-radius:50%; border:2px solid var(--border); flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:20px; font-weight:800; color:#fff; overflow:hidden;
}
.foto-prev img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
.foto-btns { display:flex; flex-direction:column; gap:6px; }
.btn-foto {
  padding:6px 14px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-family:var(--font-body);
  font-size:11px; font-weight:600; cursor:pointer; transition:all .15s;
}
.btn-foto:hover { border-color:var(--accent); color:var(--accent); }
.btn-foto.rm:hover { border-color:var(--red); color:var(--red); }

/* ══ TOAST ══ */
.toast-cnt { position:fixed; bottom:24px; right:24px; z-index:99999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast {
  padding:10px 18px; border-radius:10px; font-size:12px;
  font-family:var(--font-body); box-shadow:0 4px 20px rgba(0,0,0,.4);
  animation:fadeUp .25s ease; max-width:320px; pointer-events:auto;
}
.toast.ok    { background:#0f2a1a; border:1px solid #22c55e; color:#86efac; }
.toast.warn  { background:#422006; border:1px solid #f97316; color:#fdba74; }
.toast.error { background:#2a0a0a; border:1px solid #f87171; color:#fca5a5; }

<script>
// ════════════════════════════════════════════════════════
// CONSTANTES
// ════════════════════════════════════════════════════════
const APT_KEYS = ['qual','prio','know','comm','prod','assid','org','equip','cria','motv'];

const NIVEL_META = {
  admin_master: { label:'Admin Master', emoji:'🛡️', cor:'#f87171' },
  diretoria:    { label:'Diretoria',    emoji:'🏢', cor:'#fb923c' },
  gerencia:     { label:'Gerência',     emoji:'📊', cor:'#fbbf24' },
  coordenacao:  { label:'Coordenação',  emoji:'📋', cor:'#a78bfa' },
  encarregado:  { label:'Encarregado',  emoji:'🔰', cor:'#22d3ee' },
  lider:        { label:'Líder',        emoji:'👷', cor:'#4f8ef7' },
};
const HIERARQUIA_ORDER = ['diretoria','gerencia','coordenacao','encarregado','lider'];
const ORDEM_IDX        = ['lider','encarregado','coordenacao','gerencia','diretoria'];

const HIER_LABEL = {
  diretoria:   { text:'🏢 Diretoria',           cls:'diretoria'   },
  gerencia:    { text:'📊 Gerência',            cls:'gerencia'    },
  coordenacao: { text:'📋 Coordenação',         cls:'coordenacao' },
  encarregado: { text:'🔰 Encarregado',         cls:'encarregado' },
  lider:       { text:'👷 Liderança Operacional', cls:'lider'     },
};

// ════════════════════════════════════════════════════════
// ESTADO
// ════════════════════════════════════════════════════════
let currentUser   = null;
let _store        = null;
let _allPonto     = {};
let _orgRootId    = null;
let _orgPanelPath = [];

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await requireSession();
  if (!currentUser) return;
  initTheme();
  initSidebar('leaders', currentUser);
  const isAdmin = getUserPerfil(currentUser) === 'admin_master';
  const btnNovo = document.getElementById('btn-novo');
  if (btnNovo) btnNovo.style.display = isAdmin ? '' : 'none';
  renderLeaders();
});

// ════════════════════════════════════════════════════════
// SCORE HELPERS (síncronos — usam cache _store/_allPonto)
// ════════════════════════════════════════════════════════
function getWeights() {
  const cfg = _store?.config || {};
  const pw  = Math.min(100, Math.max(0, parseInt(cfg.perfWeight)||40));
  const aw  = Math.min(100, Math.max(0, parseInt(cfg.aptWeight) ||35));
  return { perf:pw, apt:aw, abs:Math.max(0,100-pw-aw) };
}
function calcAptMedia(emp) {
  const c = emp.competencies || {};
  return APT_KEYS.reduce((s,k)=>s+(c[k]||0),0) / APT_KEYS.length;
}
function getTotalFaltasEmp(emp) {
  try {
    const ano = emp.year || new Date().getFullYear();
    let total = 0;
    for (let m = 1; m <= 12; m++) {
      const key  = `${emp.id}_${ano}_${String(m).padStart(2,'0')}`;
      const dias = _allPonto[key] || {};
      Object.values(dias).forEach(s => {
        if (s === 'falta')    total += 1;
        if (s === 'atestado') total += 0.5;
      });
    }
    return total > 0 ? total : (emp.absences||[]).reduce((a,b)=>a+b, 0);
  } catch(e) { return (emp.absences||[]).reduce((a,b)=>a+b, 0); }
}
function calcAssid(emp) {
  if (emp.afastado) return 100;
  const total  = getTotalFaltasEmp(emp);
  const maxAbs = _store?.config?.maxAbs || 36;
  return Math.max(0, 100 - (total / maxAbs) * 100);
}
function calcBonus(emp) {
  const BONUS_POR_DIA = 0.5, BONUS_MAX = 5;
  try {
    const ano = emp.year || new Date().getFullYear();
    const feriadosCustom = _store?.config?.feriadosCustom || [];
    const ferNac = [{d:1,m:0},{d:21,m:3},{d:1,m:4},{d:7,m:8},{d:12,m:9},{d:2,m:10},{d:15,m:10},{d:25,m:11}];
    let diasBonus = 0;
    for (let m = 1; m <= 12; m++) {
      const key  = `${emp.id}_${ano}_${String(m).padStart(2,'0')}`;
      const dias = _allPonto[key] || {};
      Object.entries(dias).forEach(([dStr, status]) => {
        if (status !== 'presente') return;
        const d = parseInt(dStr), dow = new Date(ano,m-1,d).getDay();
        if (dow === 0) { diasBonus++; return; }
        if (ferNac.some(f=>f.d===d&&f.m===(m-1))) { diasBonus++; return; }
        const mesStr=String(m).padStart(2,'0'), diaStr=String(d).padStart(2,'0');
        if (feriadosCustom.some(f=>f.chave===`${mesStr}-${diaStr}`)) diasBonus++;
      });
    }
    return Math.min(BONUS_MAX, diasBonus * BONUS_POR_DIA);
  } catch(e) { return 0; }
}
function calcScore(emp) {
  const w = getWeights();
  const base = emp.perf*(w.perf/100)+calcAptMedia(emp)*10*(w.apt/100)+calcAssid(emp)*(w.abs/100);
  return Math.min(100, Math.round(base + calcBonus(emp)));
}

// ════════════════════════════════════════════════════════
// HELPERS DE ESCOPO
// ════════════════════════════════════════════════════════
function getMeusDepts(leader) {
  const depts = leader.perfil?.depts || [];
  const setor = leader.setor || '';
  return [...new Set([...depts, ...(setor ? [setor] : [])])];
}
function getMeusFiliais(leader) {
  const arr = leader.perfil?.filiais;
  if (arr && arr.length) return arr;
  return leader.perfil?.filial ? [leader.perfil.filial] : [];
}
function getMeusTurnos(leader) {
  const arr = leader.perfil?.turnos;
  if (arr && arr.length) return arr;
  return leader.perfil?.turno ? [leader.perfil.turno] : [];
}
function getEffectiveFiliais(leader, allEmps) {
  const explicit = getMeusFiliais(leader);
  if (explicit.length) return explicit;
  const ownedFiliais = [...new Set(
    allEmps.filter(e => e.filial && (e.owner_id||e.ownerId)===leader.id).map(e=>e.filial)
  )];
  if (ownedFiliais.length) return ownedFiliais;
  const depts  = getMeusDepts(leader);
  const turnos = getMeusTurnos(leader);
  if (!depts.length) return [];
  return [...new Set(
    allEmps.filter(e => {
      const dOk = depts.includes(e.dept);
      const tOk = turnos.length ? turnos.includes(e.turno) : true;
      return dOk && tOk && e.filial;
    }).map(e=>e.filial)
  )];
}
function getTeamEmps(leader, allEmps) {
  const depts  = getMeusDepts(leader);
  const turnos = getMeusTurnos(leader);
  if (!depts.length) return allEmps.filter(e=>(e.owner_id||e.ownerId)===leader.id);
  let filiais = getMeusFiliais(leader);
  if (!filiais.length) {
    filiais = [...new Set(allEmps.filter(e=>e.filial&&(e.owner_id||e.ownerId)===leader.id).map(e=>e.filial))];
  }
  const sistemMultiFilial = new Set(allEmps.filter(e=>e.filial).map(e=>e.filial)).size > 1;
  const filialOkSemDef    = !sistemMultiFilial;
  return allEmps.filter(e => {
    const deptOk   = depts.includes(e.dept);
    const turnoOk  = turnos.length  ? turnos.includes(e.turno)   : true;
    const filialOk = filiais.length ? filiais.includes(e.filial) : filialOkSemDef;
    return deptOk && turnoOk && filialOk;
  });
}
function getSubordinados(leader, allUsers, allEmps) {
  const meuIdx      = ORDEM_IDX.indexOf(leader.nivel||'lider');
  const meusDepts   = getMeusDepts(leader);
  const meusTurnos  = getMeusTurnos(leader);
  const meusFiliais = allEmps ? getEffectiveFiliais(leader, allEmps) : getMeusFiliais(leader);
  return allUsers.filter(u => {
    if (u.id===ADMIN_ID||u.nivel==='admin_master'||u.id===leader.id) return false;
    const uIdx = ORDEM_IDX.indexOf(u.nivel||'lider');
    if (uIdx >= meuIdx) return false;
    if (!meusDepts.length) return false;
    const deptOk = meusDepts.some(d=>getMeusDepts(u).includes(d));
    if (!deptOk) return false;
    const uTurnos = getMeusTurnos(u);
    if (meusTurnos.length||uTurnos.length) {
      if (!meusTurnos.length||!uTurnos.length||!meusTurnos.some(t=>uTurnos.includes(t))) return false;
    }
    const uFiliais = allEmps ? getEffectiveFiliais(u, allEmps) : getMeusFiliais(u);
    const filialPass = !(meusFiliais.length||uFiliais.length)||
      (meusFiliais.length&&uFiliais.length&&meusFiliais.some(f=>uFiliais.includes(f)));
    return filialPass;
  });
}
function getTeamTotal(leader, store) {
  const allEmps  = store.employees || [];
  const allUsers = Object.values(store.users||{}).filter(u=>u.id!==ADMIN_ID&&u.nivel!=='admin_master'&&u.id!==leader.id);
  const meuIdx   = ORDEM_IDX.indexOf(leader.nivel||'lider');
  const meusDepts= getMeusDepts(leader);
  const meusTurnos=getMeusTurnos(leader);
  let meusFiliais = getMeusFiliais(leader);
  if (!meusFiliais.length) {
    meusFiliais = [...new Set(allEmps.filter(e=>e.filial&&(e.owner_id||e.ownerId)===leader.id).map(e=>e.filial))];
  }
  const sistemMultiFilial = new Set(allEmps.filter(e=>e.filial).map(e=>e.filial)).size > 1;
  const filialOkSemDef    = !sistemMultiFilial;
  let totalFuncionarios;
  if (!meusDepts.length) {
    totalFuncionarios = allEmps.filter(e=>(e.owner_id||e.ownerId)===leader.id).length;
  } else {
    totalFuncionarios = allEmps.filter(e=>{
      const deptOk   = meusDepts.includes(e.dept);
      const turnoOk  = meusTurnos.length ? meusTurnos.includes(e.turno) : true;
      const filialOk = meusFiliais.length ? meusFiliais.includes(e.filial) : filialOkSemDef;
      return deptOk && turnoOk && filialOk;
    }).length;
  }
  const subordinados = allUsers.filter(u=>{
    const uIdx = ORDEM_IDX.indexOf(u.nivel||'lider');
    if (uIdx>=meuIdx) return false;
    if (!meusDepts.length) return false;
    const deptOk = meusDepts.some(d=>getMeusDepts(u).includes(d));
    if (!deptOk) return false;
    const uTurnos = getMeusTurnos(u);
    const turnoOk = (meusTurnos.length&&uTurnos.length) ? meusTurnos.some(t=>uTurnos.includes(t)) : true;
    const uFiliais = getEffectiveFiliais(u, allEmps);
    if (meusFiliais.length||uFiliais.length) {
      if (!meusFiliais.length||!uFiliais.length||!meusFiliais.some(f=>uFiliais.includes(f))) return false;
    }
    return turnoOk;
  });
  return totalFuncionarios + subordinados.length;
}
function getDirectSubsOrgChart(ldr, allLeaders, allEmps) {
  const myIdx     = ORDEM_IDX.indexOf(ldr.nivel||'lider');
  const myDepts   = getMeusDepts(ldr);
  const myTurnos  = getMeusTurnos(ldr);
  const myFiliais = allEmps ? getEffectiveFiliais(ldr, allEmps) : getMeusFiliais(ldr);
  for (let t = myIdx - 1; t >= 0; t--) {
    const found = allLeaders.filter(u => {
      if (ORDEM_IDX.indexOf(u.nivel||'lider') !== t) return false;
      const deptOk = myDepts.some(d=>getMeusDepts(u).includes(d));
      if (!deptOk) return false;
      const uTurnos = getMeusTurnos(u);
      if (myTurnos.length||uTurnos.length) {
        if (!myTurnos.length||!uTurnos.length||!myTurnos.some(t2=>uTurnos.includes(t2))) return false;
      }
      const uFiliais = allEmps ? getEffectiveFiliais(u, allEmps) : getMeusFiliais(u);
      if (myFiliais.length||uFiliais.length) {
        if (!myFiliais.length||!uFiliais.length||!myFiliais.some(f=>uFiliais.includes(f))) return false;
      }
      return true;
    });
    if (found.length) return found;
  }
  return [];
}

// ════════════════════════════════════════════════════════
// RENDER LEADERS
// ════════════════════════════════════════════════════════
async function renderLeaders() {
  if (!_store) {
    _store    = await getStore();
    _allPonto = await LS.get('rh_ponto', {});
  }
  const store   = _store;
  const isAdmin = getUserPerfil(currentUser) === 'admin_master';

  const allLeaders = Object.values(store.users||{})
    .filter(u => u.id !== ADMIN_ID && u.nivel !== 'admin_master')
    .sort((a,b) => (a.name||'').localeCompare(b.name||'', 'pt-BR'));

  // Popula dropdown
  const sel = document.getElementById('ldr-select');
  const cur = sel?.value || '';
  if (sel) {
    sel.innerHTML = '<option value="">👥 Todos os líderes</option>' +
      allLeaders.map(u=>`<option value="${u.id}"${u.id===cur?' selected':''}>${u.name}</option>`).join('');
    if (cur) sel.value = cur;
  }
  const selectedId = sel?.value || '';

  let leaders = selectedId ? allLeaders.filter(u=>u.id===selectedId) : allLeaders;

  const countEl = document.getElementById('filter-count');
  if (countEl) countEl.textContent = `${leaders.length} ${leaders.length===1?'líder':'líderes'}`;

  const grid = document.getElementById('leaders-grid');
  if (!leaders.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🧑‍💼</div>
      <p style="font-size:14px">Nenhum líder encontrado</p>
      <p style="font-size:12px;margin-top:6px">Cadastre novos líderes pelo botão acima.</p></div>`;
    return;
  }

  const grupos = {};
  HIERARQUIA_ORDER.forEach(n => grupos[n] = []);
  leaders.forEach(u => {
    const n = u.nivel||'lider';
    if (grupos[n]) grupos[n].push(u); else grupos['lider'].push(u);
  });

  let html = '';
  HIERARQUIA_ORDER.forEach(nivel => {
    const lista = grupos[nivel];
    if (!lista.length) return;
    const meta = HIER_LABEL[nivel];
    html += `<div class="hier-sep">
      <span class="hier-label ${meta.cls}">${meta.text}</span>
      <div class="hier-line"></div>
      <span class="hier-count">${lista.length} ${lista.length===1?'pessoa':'pessoas'}</span>
    </div>`;
    lista.forEach(u => { html += buildCard(u, store, isAdmin); });
  });

  grid.innerHTML = html;
}

// ════════════════════════════════════════════════════════
// BUILD CARD
// ════════════════════════════════════════════════════════
function buildCard(leader, store, isAdmin) {
  const allEmps  = store.employees || [];
  const team     = getTeamEmps(leader, allEmps);
  const nivel    = leader.nivel || 'lider';
  const meta     = NIVEL_META[nivel] || NIVEL_META['lider'];

  const totalTime   = team.length;
  const totalHier   = getTeamTotal(leader, store);
  const avgDesemp   = totalTime ? Math.round(team.reduce((s,e)=>s+e.perf,0)/totalTime) : 0;
  const avgAssid    = totalTime ? Math.round(team.reduce((s,e)=>s+calcAssid(e),0)/totalTime) : 0;
  const totalFaltas = Math.round(team.reduce((s,e)=>s+getTotalFaltasEmp(e),0));
  const promos      = team.filter(e=>calcScore(e)>=85).length;
  const riscos      = team.filter(e=>calcScore(e)<55).length;
  const leaderScore = totalTime ? +(team.reduce((s,e)=>s+calcAptMedia(e),0)/totalTime).toFixed(1) : 0;

  const ini      = leader.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
  const rolePart = [leader.perfil?.funcao||'', leader.setor||(leader.perfil?.depts||[])[0]||''].filter(Boolean).join(' · ');
  const filiais  = getMeusFiliais(leader);
  const turnos   = getMeusTurnos(leader);

  // Apt pendente
  const mesKey   = (() => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`; })();
  const aptPend  = team.filter(e=>!e.afastado&&!e.demitido&&!(e.competencies_history||{})[mesKey]);
  const temApt   = aptPend.length > 0;

  // Avatars da equipe
  const shown  = team.slice(0,5);
  const extras = team.length - shown.length;
  const avBubs = shown.map(e=>{
    const i = e.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
    return `<div class="av-bubble" title="${e.name}">${i}</div>`;
  }).join('') + (extras>0 ? `<div class="av-more">+${extras}</div>` : '');

  const podTransfer = isAdmin || (typeof can==='function' && can(currentUser,'leaders','transfer'));
  const podOcorr    = typeof can==='function' && can(currentUser,'leaders','ocorrencia');

  const adminBtns = (isAdmin || podTransfer || podOcorr) ? `
    <div class="lcard-actions" onclick="event.stopPropagation()">
      ${isAdmin ? `<button class="btn btn-ghost btn-sm" onclick="editLeader('${leader.id}')">✏️ Editar</button>` : ''}
      ${isAdmin ? `<button class="btn btn-ghost btn-sm" onclick="resetLeaderPass('${leader.id}','${leader.name.replace(/'/g,"\\'")}')">🔑</button>` : ''}
      ${isAdmin ? `<button class="btn btn-danger btn-sm" onclick="deleteLeader('${leader.id}')">✕</button>` : ''}
      ${podTransfer ? `<button class="btn btn-sm" style="background:rgba(251,191,36,.1);color:var(--yellow);border:1px solid rgba(251,191,36,.25)" onclick="openTransfer('${leader.id}')">🔀 Transferir</button>` : ''}
      ${podOcorr    ? `<button class="btn btn-sm" style="background:rgba(167,139,250,.1);color:var(--accent2);border:1px solid rgba(167,139,250,.25)" onclick="openOcorrencia('${leader.id}')">📝 Ocorrência</button>` : ''}
    </div>` : '';

  return `
  <div class="lcard lvl-${nivel}${temApt?' apt-pendente':''}"
       onclick="openOrg('${leader.id}')"
       title="${leader.name} — clique para ver o organograma">
    <div class="lcard-header">
      <div class="lcard-header-bg"></div>
      <div class="lcard-stripe"></div>
      <div class="lcard-lvl-badge" style="background:${meta.cor}22;color:${meta.cor};border:1px solid ${meta.cor}44">
        ${meta.emoji} ${meta.label}
      </div>
    </div>
    <div class="lcard-identity">
      <div class="lcard-avatar" style="background:${leader.foto?'transparent':`linear-gradient(135deg,${meta.cor},${meta.cor}88)`}">
        ${leader.foto?`<img src="${leader.foto}" style="width:52px;height:52px;border-radius:50%;object-fit:cover">`:ini}
      </div>
      <div class="lcard-info">
        <div class="lcard-name">${leader.name}</div>
        <div class="lcard-role">${rolePart||nivel}</div>
      </div>
    </div>
    <div class="lcard-metrics">
      <div class="lcard-metric">
        <div class="lcard-metric-val v-team">${totalHier}</div>
        <div class="lcard-metric-lbl">Time</div>
      </div>
      <div class="lcard-metric">
        <div class="lcard-metric-val v-desemp">${avgDesemp}%</div>
        <div class="lcard-metric-lbl">Desempenho</div>
      </div>
      <div class="lcard-metric">
        <div class="lcard-metric-val v-score">${leaderScore}</div>
        <div class="lcard-metric-lbl">Score</div>
      </div>
    </div>
    <div class="lcard-stats">
      <div class="lcard-stat">
        <div class="lcard-stat-lbl">Assiduidade</div>
        <div class="lcard-stat-val ${avgAssid>=80?'stat-green':avgAssid>=60?'stat-warn':'stat-red'}">${totalTime?avgAssid+'%':'—'}</div>
      </div>
      <div class="lcard-stat">
        <div class="lcard-stat-lbl">Faltas</div>
        <div class="lcard-stat-val stat-text">${totalFaltas}</div>
      </div>
      <div class="lcard-stat">
        <div class="lcard-stat-lbl">Promoção</div>
        <div class="lcard-stat-val stat-green">${promos}</div>
      </div>
      <div class="lcard-stat">
        <div class="lcard-stat-lbl">Risco</div>
        <div class="lcard-stat-val ${riscos>0?'stat-red':'stat-text'}">${riscos}</div>
      </div>
    </div>
    ${totalTime>0 ? `
    <div class="lcard-team">
      <div class="lcard-team-lbl">Equipe · ${totalHier} ${totalHier===1?'pessoa':'pessoas'}</div>
      ${avBubs}
    </div>` : ''}
    ${filiais.length||turnos.length ? `
    <div class="lcard-tags">
      ${filiais.map(f=>`<span class="tag tag-filial">🏭 ${f}</span>`).join('')}
      ${turnos.map(t=>`<span class="tag tag-turno">🕐 ${t}</span>`).join('')}
    </div>` : ''}
    ${temApt ? `
    <div class="lcard-apt" onclick="event.stopPropagation();window.location.href='aptidoes.html'">
      🎯 ${aptPend.length} funcionário${aptPend.length>1?'s':''} sem avaliação este mês
      <span style="margin-left:auto;font-size:10px;opacity:.7">→ Avaliar</span>
    </div>` : ''}
    <div class="lcard-org-hint">
      <span>🌳</span> Clique para ver o organograma
    </div>
    ${adminBtns}
  </div>`;
}

// ORGANOGRAMA — painéis deslizantes
// ════════════════════════════════════════════════════════
function openOrg(leaderId) {
  _orgRootId    = leaderId;
  _orgPanelPath = [];
  renderOrg(leaderId);
  document.getElementById('ov-org').classList.add('open');
}
function closeOrg() {
  document.getElementById('ov-org').classList.remove('open');
  _orgPanelPath = [];
}

function selectOrgNode(leaderId, panelIdx) {
  _orgPanelPath = _orgPanelPath.slice(0, panelIdx);
  _orgPanelPath.push(leaderId);
  renderOrg(_orgRootId);
}

function renderOrg(leaderId) {
  _orgRootId = leaderId;
  const store  = _store;
  const leader = store?.users?.[leaderId];
  if (!leader) return;

  const lm  = NIVEL_META[leader.nivel||'lider'] || NIVEL_META.lider;
  const ini = leader.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

  // Header do modal
  const hAv = document.getElementById('org-hdr-av');
  hAv.style.background = leader.foto ? 'transparent' : `linear-gradient(135deg,${lm.cor},${lm.cor}88)`;
  hAv.innerHTML = leader.foto
    ? `<img src="${leader.foto}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">` : ini;
  document.getElementById('org-hdr-name').textContent = leader.name;
  document.getElementById('org-hdr-sub').textContent  = `${lm.emoji} ${lm.label} · Organograma da equipe`;

  const allLeaders = Object.values(store.users||{}).filter(u=>u.id!==ADMIN_ID&&u.nivel!=='admin_master');
  const allEmps    = store.employees || [];
  const container  = document.getElementById('org-panels');
  container.innerHTML = '';

  const panelIds = [leaderId, ..._orgPanelPath];

  panelIds.forEach((lid, panelIdx) => {
    const pl = store.users?.[lid];
    if (!pl) return;

    const pm   = NIVEL_META[pl.nivel||'lider'] || NIVEL_META.lider;
    const pIni = pl.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

    const dirSubs    = getDirectSubsOrgChart(pl, allLeaders, allEmps);
    const teamEmps   = getTeamEmps(pl, allEmps);
    const subEmpIds  = new Set(dirSubs.flatMap(s=>getTeamEmps(s, allEmps).map(e=>e.id)));
    const directEmps = teamEmps.filter(e=>!subEmpIds.has(e.id));
    const selectedId = _orgPanelPath[panelIdx];

    const panel = document.createElement('div');
    panel.className = 'org-panel';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'org-panel-hdr';
    hdr.style.borderBottomColor = pm.cor + '66';
    hdr.innerHTML = `
      <div class="org-panel-av" style="background:${pl.foto?'transparent':`linear-gradient(135deg,${pm.cor},${pm.cor}77)`}">
        ${pl.foto?`<img src="${pl.foto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:pIni}
      </div>
      <div style="flex:1;min-width:0">
        <div class="org-panel-nm">${pl.name.split(' ').slice(0,2).join(' ')}</div>
        <div class="org-panel-rl">${pm.emoji} ${pm.label}</div>
      </div>`;
    panel.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'org-panel-body';

    // Sub-líderes
    if (dirSubs.length) {
      const sec = document.createElement('div');
      sec.className = 'org-sec-lbl';
      sec.textContent = `👔 Líderes (${dirSubs.length})`;
      body.appendChild(sec);

      dirSubs.forEach(sub => {
        const sm       = NIVEL_META[sub.nivel||'lider'] || NIVEL_META.lider;
        const isSelected = sub.id === selectedId;
        const sIni     = sub.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
        const hasSubs  = getDirectSubsOrgChart(sub, allLeaders, allEmps).length>0 || getTeamEmps(sub, allEmps).length>0;
        const total    = getTeamTotal(sub, store);

        const item = document.createElement('div');
        item.className = 'org-item';
        item.style.borderLeftColor = sm.cor + (isSelected?'':' 55');
        if (isSelected) item.style.background = sm.cor + '1a';
        item.onclick = () => selectOrgNode(sub.id, panelIdx);
        item.innerHTML = `
          <div class="org-item-av" style="background:${sub.foto?'transparent':`linear-gradient(135deg,${sm.cor},${sm.cor}77)`}">
            ${sub.foto?`<img src="${sub.foto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:sIni}
          </div>
          <div class="org-item-info">
            <div class="org-item-nm">${sub.name.split(' ').slice(0,2).join(' ')}</div>
            <div class="org-item-rl" style="color:${sm.cor}cc">${sm.emoji} ${sm.label}</div>
            ${total?`<div class="org-item-cnt">👥 ${total} ${total===1?'pessoa':'pessoas'}</div>`:''}
          </div>
          ${hasSubs?`<div class="org-item-arr${isSelected?' sel':''}">›</div>`:''}`;
        body.appendChild(item);
      });
    }

    // Funcionários diretos
    if (directEmps.length) {
      const sec = document.createElement('div');
      sec.className = 'org-sec-lbl';
      sec.textContent = `👥 Operacional (${directEmps.length})`;
      body.appendChild(sec);

      directEmps.slice(0, 20).forEach(emp => {
        const eIni = emp.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
        const item = document.createElement('div');
        item.className = 'org-item org-emp';
        item.innerHTML = `
          <div class="org-item-av emp-av">
            ${emp.foto?`<img src="${emp.foto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:eIni}
          </div>
          <div class="org-item-info">
            <div class="org-item-nm">${emp.name.split(' ').slice(0,2).join(' ')}</div>
            <div class="org-item-rl">${(emp.role||emp.dept||'Operacional').slice(0,24)}</div>
          </div>`;
        body.appendChild(item);
      });

      if (directEmps.length > 20) {
        const more = document.createElement('div');
        more.style.cssText = 'text-align:center;padding:8px 0 12px;font-size:10px;color:var(--muted)';
        more.textContent = `+ ${directEmps.length-20} mais`;
        body.appendChild(more);
      }
    }

    // Vazio
    if (!dirSubs.length && !directEmps.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:36px 16px;text-align:center;color:var(--muted);font-size:12px';
      empty.innerHTML = '<div style="font-size:30px;margin-bottom:8px">👤</div>Sem subordinados';
      body.appendChild(empty);
    }

    panel.appendChild(body);
    container.appendChild(panel);
  });

  setTimeout(() => { container.scrollLeft = container.scrollWidth; }, 30);
}

async function openModal(leader) {
  const store = await getStore();
  document.getElementById('edit-title').textContent = leader ? 'Editar Líder' : 'Novo Líder';
  document.getElementById('f-edit-id').value = leader?.id || '';

  const fotoVal = leader?.foto || '';
  document.getElementById('f-foto').value = fotoVal;
  const prev = document.getElementById('foto-prev');
  if (fotoVal) {
    prev.innerHTML = `<img src="${fotoVal}" alt="foto">`;
  } else {
    const nm  = leader?.name||'';
    const ini = nm.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'?';
    prev.innerHTML = `<span id="foto-ini">${ini}</span>`;
  }

  document.getElementById('f-name').value  = leader?.name||'';
  document.getElementById('f-id').value    = leader?.id||'';
  document.getElementById('f-role').value  = leader?.perfil?.funcao||'';
  document.getElementById('f-nivel').value = leader?.nivel||'lider';
  document.getElementById('f-pass').value  = '';

  const idInp = document.getElementById('f-id');
  idInp.disabled = !!leader; idInp.style.opacity = leader?'.5':'1';
  document.getElementById('pass-wrap').style.display = leader?'none':'';

  const checks = (listId, items, selectedArr, emoji) => {
    const el = document.getElementById(listId);
    if (!items.length) { el.innerHTML=`<div style="color:var(--muted);font-size:12px">Nenhum cadastrado.</div>`; return; }
    el.innerHTML = items.map(x=>`
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text);padding:6px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border)">
        <input type="checkbox" value="${x.nome}" ${selectedArr.includes(x.nome)?'checked':''}
          style="accent-color:var(--accent);width:16px;height:16px">
        ${emoji} ${x.nome}
      </label>`).join('');
  };

  const selFiliais = leader?.perfil?.filiais||(leader?.perfil?.filial?[leader.perfil.filial]:[]);
  const selTurnos  = leader?.perfil?.turnos ||(leader?.perfil?.turno ?[leader.perfil.turno] :[]);
  const selDepts   = leader?.perfil?.depts  ||[];

  checks('f-filiais-list', store.filiais||[], selFiliais, '🏭');
  checks('f-turnos-list',  store.turnos||[],  selTurnos,  '🕐');
  checks('f-depts-list',   store.depts||[],   selDepts,   '🏢');

  document.getElementById('ov-edit').classList.add('open');
  document.getElementById('f-name').focus();
}

function closeModal() { document.getElementById('ov-edit').classList.remove('open'); }

async function editLeader(id) {
  const store  = await getStore();
  const leader = store.users[id];
  if (!leader) return;
  openModal(leader);
}

async function saveLeader() {
  const name   = document.getElementById('f-name').value.trim();
  const id     = document.getElementById('f-id').value.trim();
  const nivel  = document.getElementById('f-nivel').value;
  const editId = document.getElementById('f-edit-id').value;

  if (!name)          { showToast('⚠️ Nome é obrigatório.','warn'); return; }
  if (!editId && !id) { showToast('⚠️ ID de acesso é obrigatório.','warn'); return; }

  const store = await getStore();
  const pass  = document.getElementById('f-pass').value;
  if (!editId && pass.length<6) { showToast('⚠️ Senha com mínimo 6 caracteres.','warn'); return; }
  if (!editId && store.users[id]) { showToast('❌ Este ID já está cadastrado.','error'); return; }

  const depts   = [...document.querySelectorAll('#f-depts-list input:checked')].map(c=>c.value);
  const filiais = [...document.querySelectorAll('#f-filiais-list input:checked')].map(c=>c.value);
  const turnos  = [...document.querySelectorAll('#f-turnos-list input:checked')].map(c=>c.value);
  const perfil  = { filiais, turnos, filial:filiais[0]||'', turno:turnos[0]||'', funcao:document.getElementById('f-role').value, depts };

  if (editId) {
    if (!store.users[editId]) { showToast('❌ Usuário não encontrado.','error'); return; }
    const fotoLider = document.getElementById('f-foto').value || store.users[editId].foto || null;
    store.users[editId] = { ...store.users[editId], name, nivel, perfil, foto:fotoLider };
    await registrarLog('editou','Líderes',`Editou: <strong>${name}</strong>`);
    showToast('✅ Líder atualizado!');
  } else {
    const fotoNovo = document.getElementById('f-foto').value || null;
    store.users[id] = { id, name, pass, nivel, setor:depts[0]||'', perfil, foto:fotoNovo };
    await registrarLog('criou','Líderes',`Novo líder: <strong>${name}</strong> (${nivel})`);
    showToast('✅ Líder cadastrado!');
  }

  await saveStore(store);
  _store = null;
  closeModal();
  renderLeaders();
}

async function resetLeaderPass(id, nome) {
  const nova = prompt(`Nova senha para "${nome}" (mín. 6 caracteres):`);
  if (!nova) return;
  if (nova.length<6) { showToast('❌ Senha muito curta.','error'); return; }
  const store = await getStore();
  if (!store.users[id]) { showToast('❌ Usuário não encontrado.','error'); return; }
  store.users[id].pass = nova;
  await saveStore(store);
  await registrarLog('editou','Líderes',`Redefiniu senha de: <strong>${nome}</strong>`);
  showToast('✅ Senha redefinida!');
}

async function deleteLeader(id) {
  const store = await getStore();
  const u     = store.users[id];
  if (!u) return;
  if (!confirm(`Remover o líder "${u.name}"?\nOs funcionários não serão removidos.`)) return;
  delete store.users[id];
  await saveStore(store);
  _store = null;
  renderLeaders();
  await registrarLog('excluiu','Líderes',`Removeu: <strong>${u.name}</strong>`);
  showToast('✅ Líder removido.');
}

// ════════════════════════════════════════════════════════
// TRANSFERIR LÍDER
// ════════════════════════════════════════════════════════
async function openTransfer(id) {
  const store  = await getStore();
  const leader = store.users?.[id];
  if (!leader) return;

  const checks = (listId, items, selectedArr, emoji) => {
    const el = document.getElementById(listId);
    if (!items.length) { el.innerHTML=`<span style="color:var(--muted);font-size:12px">Nenhum cadastrado.</span>`; return; }
    el.innerHTML = items.map(x=>`
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text);padding:5px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border)">
        <input type="checkbox" value="${x.nome}" ${selectedArr.includes(x.nome)?'checked':''}
          style="accent-color:var(--accent);width:14px;height:14px">
        ${emoji} ${x.nome}
      </label>`).join('');
  };

  const selFiliais = leader.perfil?.filiais||(leader.perfil?.filial?[leader.perfil.filial]:[]);
  const selTurnos  = leader.perfil?.turnos ||(leader.perfil?.turno ?[leader.perfil.turno] :[]);
  const selDepts   = leader.perfil?.depts  ||[];

  document.getElementById('ltr-name').textContent = leader.name;
  document.getElementById('ltr-id').value         = id;
  checks('ltr-filiais', store.filiais||[], selFiliais, '🏭');
  checks('ltr-turnos',  store.turnos||[],  selTurnos,  '🕐');
  checks('ltr-depts',   store.depts||[],   selDepts,   '🏢');

  document.getElementById('ov-transfer').classList.add('open');
}
function closeTransfer() { document.getElementById('ov-transfer').classList.remove('open'); }

async function saveTransfer() {
  const id    = document.getElementById('ltr-id').value;
  const store = await getStore();
  if (!store.users?.[id]) { showToast('❌ Usuário não encontrado.','error'); return; }

  const filiais = [...document.querySelectorAll('#ltr-filiais input:checked')].map(c=>c.value);
  const turnos  = [...document.querySelectorAll('#ltr-turnos input:checked')].map(c=>c.value);
  const depts   = [...document.querySelectorAll('#ltr-depts input:checked')].map(c=>c.value);

  if (!store.users[id].perfil) store.users[id].perfil = {};
  store.users[id].perfil.filiais = filiais;
  store.users[id].perfil.turnos  = turnos;
  store.users[id].perfil.filial  = filiais[0]||'';
  store.users[id].perfil.turno   = turnos[0] ||'';
  store.users[id].perfil.depts   = depts;
  store.users[id].setor          = depts[0]  ||'';

  await saveStore(store);
  closeTransfer();
  _store = null;
  renderLeaders();
  await registrarLog('editou','Líderes',`Atualizou responsabilidades: <strong>${store.users[id]?.name||id}</strong>`);
  showToast('✅ Responsabilidades atualizadas!');
}

// ════════════════════════════════════════════════════════
// OCORRÊNCIA DO LÍDER
// ════════════════════════════════════════════════════════
async function openOcorrencia(id) {
  const store  = await getStore();
  const leader = store.users?.[id];
  if (!leader) return;
  document.getElementById('oc-name').textContent = leader.name;
  document.getElementById('oc-id').value         = id;
  document.getElementById('oc-tipo').value        = '';
  document.getElementById('oc-desc').value        = '';
  const agora = new Date();
  agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
  document.getElementById('oc-data').value = agora.toISOString().slice(0,16);
  document.getElementById('ov-oc').classList.add('open');
}
function closeOcorrencia() { document.getElementById('ov-oc').classList.remove('open'); }

async function saveOcorrencia() {
  const refId = document.getElementById('oc-id').value;
  const tipo  = document.getElementById('oc-tipo').value;
  const desc  = document.getElementById('oc-desc').value.trim();
  const data  = document.getElementById('oc-data').value;
  if (!tipo) { showToast('⚠️ Selecione o tipo de ocorrência.','warn'); return; }
  if (!desc) { showToast('⚠️ Descreva a ocorrência.','warn'); document.getElementById('oc-desc').focus(); return; }

  const store  = await getStore();
  const leader = store.users?.[refId];
  const lista  = await LS.get('rh_ocorrencias', []);
  lista.unshift({
    id:      uid(), ts:(()=>{ if(!data) return new Date().toISOString(); const d=new Date(data); return isNaN(d)?new Date().toISOString():d.toISOString(); })(),
    empId:   refId, empName:leader?.name||'—', empDept:leader?.setor||leader?.perfil?.depts?.[0]||'—',
    tipo, desc, obs:'', status:'pendente',
    respName:currentUser.name, respId:currentUser.id,
    createdAt:new Date().toISOString(), _isLider:true,
  });
  await LS.set('rh_ocorrencias', lista);
  await registrarLog('criou','Ocorrências',`Ocorrência <strong>${tipo}</strong> para líder <strong>${leader?.name||'—'}</strong>`);
  closeOcorrencia();
  showToast('✅ Ocorrência registrada!');
}

// ════════════════════════════════════════════════════════
// FOTO
// ════════════════════════════════════════════════════════
function processarFoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 80; canvas.height = 80;
      const ctx  = canvas.getContext('2d');
      const size = Math.min(img.width, img.height);
      const sx   = (img.width-size)/2, sy=(img.height-size)/2;
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 80, 80);
      const base64 = canvas.toDataURL('image/jpeg', 0.65);
      document.getElementById('f-foto').value = base64;
      document.getElementById('foto-prev').innerHTML = `<img src="${base64}" alt="foto">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function removerFoto() {
  document.getElementById('f-foto').value = '';
  const nm  = document.getElementById('f-name').value.trim();
  const ini = nm.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'?';
  document.getElementById('foto-prev').innerHTML = `<span id="foto-ini">${ini}</span>`;
}
