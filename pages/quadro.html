<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadro Operacional · RH Nagumo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../sidebar.css">
<link rel="stylesheet" href="../light-theme.css">
<link rel="stylesheet" href="../responsive.css">
<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase.js"></script>
<script src="../permissions.js"></script>
<script src="../shared.js"></script>
<style>
:root {
  --bg:#0b0d14; --surface:#12151f; --surface2:#1a1e2e; --surface3:#222638;
  --border:#2a2f45; --accent:#4f8ef7; --accent2:#a78bfa;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171; --orange:#fb923c;
  --cyan:#22d3ee; --text:#ffffff; --muted:#94a3b8;
  --font-head:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  --sidebar-w:220px;
}
/* [light-theme.css] body.light-theme {
  --bg:#EEF2F8; --surface:#fff; --surface2:#F4F7FB; --surface3:#E8EDF5;
  --border:#D6DDE8; --accent:#2563eb; --accent2:#7c3aed; --green:#059669;
  --yellow:#d97706; --red:#dc2626; --orange:#ea580c; --cyan:#0891b2;
  --text:#0f172a; --muted:#64748b;
} */
/* [light-theme.css] body.light-theme 

body.light-theme .main            { background:#EEF2F8; } */
/* [light-theme.css] body.light-theme .page-title      { color:#0f172a; } */
/* [light-theme.css] body.light-theme .page-title span { color:#2563eb; } */
/* [light-theme.css] body.light-theme .filial-btn      { background:#fff; border-color:#CBD5E1; color:#64748b; } */
/* [light-theme.css] body.light-theme .filial-btn:hover{ border-color:#2563eb; color:#2563eb; } */
/* [light-theme.css] body.light-theme .filial-btn.active{ background:rgba(37,99,235,.1); border-color:#2563eb; color:#2563eb; } */
/* [light-theme.css] body.light-theme .summary-card    { background:#fff; border-color:#E2E8F0; } */
/* [light-theme.css] body.light-theme .summary-label   { color:#64748b; } */
/* [light-theme.css] body.light-theme .turno-card      { background:#fff; border-color:#E2E8F0; } */
/* [light-theme.css] body.light-theme .turno-table th  { background:#F4F7FB; color:#475569; border-bottom-color:#E2E8F0; } */
/* [light-theme.css] body.light-theme .turno-table td  { border-bottom-color:#F1F5F9; color:#0f172a; } */
/* [light-theme.css] body.light-theme .turno-table tr:hover td { background:#F4F7FB; } */
/* [light-theme.css] body.light-theme .afastado-card   { background:#fff; border-color:#E2E8F0; } */
/* [light-theme.css] body.light-theme .afastado-name   { color:#0f172a; } */
/* [light-theme.css] body.light-theme .afastado-role   { color:#64748b; } */
/* [light-theme.css] body.light-theme .num-input       { background:#F4F7FB; border-color:#CBD5E1; color:#0f172a; } */
/* [light-theme.css] body.light-theme ::-webkit-scrollbar-track { background:#F1F5F9; } */
/* [light-theme.css] body.light-theme ::-webkit-scrollbar-thumb { background:#CBD5E1; } */

/* ── Base ── */
* { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; }
body { background:var(--bg); color:var(--text); font-family:var(--font-body); min-height:100vh; overflow-x:hidden; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--surface); }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }

/* ── Main ── */
.main { margin-left:var(--sidebar-w); padding:24px 28px; min-height:100vh; }

/* ── Topbar ── */
.topbar { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
.page-title { font-family:var(--font-head); font-size:26px; font-weight:800; letter-spacing:-1.2px; }
.page-title span { color:var(--accent); }
.page-sub { font-size:12px; color:var(--muted); margin-top:4px; }

/* ── Botão salvar ── */
.btn-save {
  display:inline-flex; align-items:center; gap:8px; padding:9px 20px;
  border-radius:8px; border:none; background:var(--accent); color:#fff;
  font-family:var(--font-body); font-size:12px; font-weight:700;
  cursor:pointer; transition:all .2s;
}
.btn-save:hover { background:#3a7ae0; transform:translateY(-1px); box-shadow:0 4px 16px rgba(79,142,247,.4); }
.btn-save:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }

/* ── Seletor de filiais ── */
.filial-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.filial-btn {
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 18px; border-radius:9px; border:1.5px solid var(--border);
  background:var(--surface); color:var(--muted);
  font-family:var(--font-body); font-size:13px; font-weight:600;
  cursor:pointer; transition:all .18s; user-select:none;
}
.filial-btn:hover  { border-color:var(--accent); color:var(--text); }
.filial-btn.active { background:rgba(79,142,247,.12); border-color:var(--accent); color:var(--accent); }

/* ── Summary cards ── */
.summary-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.summary-card {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:14px 18px; transition:transform .2s;
}
.summary-card:hover { transform:translateY(-2px); }
.summary-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:6px; }
.summary-value { font-family:var(--font-head); font-size:28px; font-weight:800; letter-spacing:-1.5px; line-height:1; }
.summary-value.blue   { color:#93C5FD; }
.summary-value.green  { color:#6EE7B7; }
.summary-value.red    { color:#FCA5A5; }
.summary-value.yellow { color:#FDE68A; }
/* tema claro */
/* [light-theme.css] body.light-theme .summary-value.blue   { color:#1D4ED8; } */
/* [light-theme.css] body.light-theme .summary-value.green  { color:#059669; } */
/* [light-theme.css] body.light-theme .summary-value.red    { color:#DC2626; } */
/* [light-theme.css] body.light-theme .summary-value.yellow { color:#D97706; } */

/* ── Grade de turnos ── */
.turnos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; margin-bottom:20px; }

.turno-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:14px; overflow:hidden; transition:box-shadow .2s;
}
.turno-card:hover { box-shadow:0 4px 20px rgba(0,0,0,.18); }

.turno-header {
  padding:14px 18px 12px; display:flex; align-items:center;
  justify-content:space-between; border-bottom:1px solid var(--border);
}
.turno-title { font-family:var(--font-head); font-size:15px; font-weight:800; }
.turno-total { font-family:var(--font-head); font-size:13px; font-weight:700; }
.turno-sub   { font-size:11px; color:var(--muted); margin-top:2px; }

.turno-table { width:100%; border-collapse:collapse; }
.turno-table th {
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
  color:var(--muted); padding:8px 16px; border-bottom:1px solid var(--border);
  text-align:left; background:var(--surface2);
}
.turno-table th:not(:first-child) { text-align:center; }
.turno-table td {
  padding:11px 16px; border-bottom:1px solid rgba(42,47,69,.35);
  vertical-align:middle; font-size:13px;
}
.turno-table tr:last-child td { border-bottom:none; }
.turno-table tr:hover td { background:var(--surface2); }
.turno-table td:not(:first-child) { text-align:center; }

/* input de vagas */
.num-input {
  width:60px; text-align:center; padding:5px 6px;
  font-family:var(--font-head); font-size:14px; font-weight:700;
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:6px; color:var(--text); outline:none;
  transition:border-color .2s;
}
.num-input:focus { border-color:var(--accent); }
.num-input:read-only { opacity:.45; cursor:not-allowed; background:var(--surface3); }

.atual-val { font-family:var(--font-head); font-size:16px; font-weight:800; }

/* badges situação */
.sit-badge { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:8px; font-size:12px; font-weight:700; white-space:nowrap; }
.sit-ok      { background:rgba(52,211,153,.15); color:#34d399; border:1px solid rgba(52,211,153,.3); }
.sit-warn    { background:rgba(251,191,36,.15);  color:#fbbf24; border:1px solid rgba(251,191,36,.3); }
.sit-risk    { background:rgba(248,113,113,.15); color:#f87171; border:1px solid rgba(248,113,113,.3); }
.sit-excess  { background:rgba(34,211,238,.15);  color:#22d3ee; border:1px solid rgba(34,211,238,.3); }

/* ── Afastados ── */
.afastado-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:18px; margin-bottom:20px;
}
.afastado-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.afastado-title  { font-family:var(--font-head); font-size:15px; font-weight:700; color:var(--text); }
.afastado-badge  { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; background:rgba(248,113,113,.15); color:var(--red); border:1px solid rgba(248,113,113,.3); }

.afastado-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(42,47,69,.35); }
.afastado-item:last-child { border-bottom:none; }
.af-avatar {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(135deg,#ef4444,#fb923c);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-size:12px; font-weight:800; color:#fff;
}
.af-info { flex:1; min-width:0; }
.afastado-name { font-size:14px; font-weight:700; color:var(--text); }
.afastado-role { font-size:11px; color:var(--muted); margin-top:2px; }
.af-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.dias-badge {
  padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
  background:rgba(251,146,60,.15); color:var(--orange);
  border:1px solid rgba(251,146,60,.3);
}

/* ── Toast ── */
.toast-container { position:fixed; bottom:24px; right:24px; z-index:99999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
.toast { padding:10px 18px; border-radius:10px; font-size:12px; font-family:var(--font-body); box-shadow:0 4px 20px rgba(0,0,0,.4); animation:fadeUp .25s ease; max-width:320px; pointer-events:auto; }
.toast.ok    { background:#0f2a1a; border:1px solid #22c55e; color:#86efac; }
.toast.warn  { background:#422006; border:1px solid #f97316; color:#fdba74; }
.toast.error { background:#2a0a0a; border:1px solid #f87171; color:#fca5a5; }
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* ── Empty state ── */
.empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
.empty-icon  { font-size:48px; margin-bottom:12px; }

/* ── Responsive ── */
@media(max-width:1024px) {
  :root { --sidebar-w:56px; }
  
  
  
  

  .summary-row { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:768px) {
  :root { --sidebar-w:0px; }
  
  .main { margin-left:0; padding:16px; }
  .summary-row { grid-template-columns:1fr 1fr; }
  .turnos-grid { grid-template-columns:1fr; }
}

}

</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>
<nav id="app-sidebar"></nav>

<main class="main">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="page-title">📋 Quadro <span>Operacional</span></div>
      <div class="page-sub" id="quadro-sub">Selecione uma filial</div>
    </div>
    <button class="btn-save" id="btn-salvar" onclick="salvarQuadro()" disabled>
      💾 Salvar E Atualizar
    </button>
  </div>

  <!-- Seletor de filiais -->
  <div class="filial-row" id="filial-row"></div>

  <!-- Conteúdo dinâmico -->
  <div id="quadro-content"></div>

</main>

<script>
// ════════════════════════════════════════════════════════
// ESTADO
// ════════════════════════════════════════════════════════
let currentUser    = null;
let filialAtiva    = null;
let podeEditar     = false; // permissão de editar vagas/total
let quadroData     = {};    // { [filialNome]: { totalQuadro:N, vagas:{ [funcNome_turnoNome]: N } } }

const TURNO_CORES = [
  { border:'#4f8ef7', title:'#4f8ef7', total:'#34d399' },
  { border:'#34d399', title:'#34d399', total:'#22d3ee' },
  { border:'#f472b6', title:'#f472b6', total:'#fbbf24' },
  { border:'#fb923c', title:'#fb923c', total:'#a78bfa' },
  { border:'#a78bfa', title:'#a78bfa', total:'#22d3ee' },
  { border:'#22d3ee', title:'#22d3ee', total:'#34d399' },
];

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  currentUser = await requireSession();
  if (!currentUser) return;

  initTheme();
  initSidebar('quadro', currentUser);

  // Verifica permissão de editar
  podeEditar = (typeof can === 'function')
    ? can(currentUser, 'quadro', 'edit_vagas')
    : currentUser.nivel === 'admin_master';

  // Habilita/desabilita botão salvar
  document.getElementById('btn-salvar').disabled = !podeEditar;

  // Carrega dados salvos
  carregarQuadroData();
  buildFilialRow();
});

// ════════════════════════════════════════════════════════
// PERSISTÊNCIA
// ════════════════════════════════════════════════════════
async function carregarQuadroData() {
  quadroData = await LS.get('rh_quadro', {});
}


async function autoSalvarTotal(val) {
  if (!filialAtiva) return;
  if (!quadroData[filialAtiva]) quadroData[filialAtiva] = { totalQuadro:0, vagas:{} };
  quadroData[filialAtiva].totalQuadro = parseInt(val) || 0;
  await LS.set('rh_quadro', quadroData);
}

async function salvarQuadro() {
  if (!podeEditar) { showToast('⚠️ Sem permissão para editar o quadro.', 'warn'); return; }
  if (!filialAtiva) { showToast('⚠️ Selecione uma filial primeiro.', 'warn'); return; }

  const store = await getStore();
  const filial = store.filiais.find(f => f.nome === filialAtiva);
  if (!filial) return;

  if (!quadroData[filialAtiva]) quadroData[filialAtiva] = { totalQuadro:0, vagas:{} };

  // Lê total quadro
  const totalInput = document.getElementById('input-total-quadro');
  if (totalInput) quadroData[filialAtiva].totalQuadro = parseInt(totalInput.value) || 0;

  // Lê todas as vagas dos inputs
  document.querySelectorAll('.vaga-input').forEach(inp => {
    const key = inp.dataset.key;
    if (key) quadroData[filialAtiva].vagas[key] = parseInt(inp.value) || 0;
  });

  await LS.set('rh_quadro', quadroData);

  // Registra alterações no log
  const total = quadroData[filialAtiva]?.totalQuadro || 0;
  const vagas = Object.entries(quadroData[filialAtiva]?.vagas || {})
    .filter(([,v]) => v > 0)
    .map(([k,v]) => `${k.replace('__',' / ')}:${v}`)
    .join(', ');
  await registrarLog('editou', 'Quadro Operacional',
    `<strong>${filialAtiva}</strong> — Total: <strong>${total}</strong>${vagas ? ` · Vagas: ${vagas}` : ''}`
  );

  showToast('✅ Quadro salvo com sucesso!');
  renderQuadroContent(); // re-renderiza para atualizar situações
}

// ════════════════════════════════════════════════════════
// SELETOR DE FILIAIS
// ════════════════════════════════════════════════════════
async function buildFilialRow() {
  const store   = await getStore();
  const filiais = store.filiais || [];
  const row     = document.getElementById('filial-row');

  if (!filiais.length) {
    row.innerHTML = `<div style="color:var(--muted);font-size:13px">Nenhuma filial cadastrada. Acesse Configurações para adicionar.</div>`;
    return;
  }

  row.innerHTML = filiais.map((f, i) => `
    <button class="filial-btn ${filialAtiva===f.nome?'active':''}"
      onclick="selecionarFilial('${f.nome}')">
      🏭 ${f.nome}
    </button>`).join('');

  // Seleciona a primeira automaticamente se nenhuma estiver ativa
  if (!filialAtiva && filiais.length) {
    selecionarFilial(filiais[0].nome);
  }
}

function selecionarFilial(nome) {
  filialAtiva = nome;

  // Atualiza botões
  document.querySelectorAll('.filial-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().includes(nome));
  });

  document.getElementById('quadro-sub').textContent = `Filial: ${nome}`;
  renderQuadroContent();
}

// ════════════════════════════════════════════════════════
// CONTEÚDO PRINCIPAL
// ════════════════════════════════════════════════════════
async function renderQuadroContent() {
  if (!filialAtiva) return;

  const store   = await getStore();
  const filial  = store.filiais.find(f => f.nome === filialAtiva);
  if (!filial) return;

  const allEmps  = store.employees || [];
  const empsFilial = allEmps.filter(e =>
    e.filial === filialAtiva || e.filial_id === filial.id
  );
  const turnos   = store.turnos  || [];
  const funcoes  = store.funcoes || [];
  const dadosF   = quadroData[filialAtiva] || { totalQuadro:0, vagas:{} };

  // ── Afastados desta filial ──
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const afastados = empsFilial.filter(e => {
    if (!e.afastado) return false;
    if (e.data_afastamento) {
      return new Date(e.data_afastamento+'T00:00:00') <= hoje;
    }
    return true;
  });

  // ── Summary ──
  const totalQuadro = dadosF.totalQuadro || 0;
  const totalCad    = empsFilial.length;
  const totalAfast  = afastados.length;
  const vagas       = Math.max(0, totalQuadro - totalCad);

  // ── Turnos com funcionários ou vagas definidas ──
  const turnosMostrar = turnos.filter(t => {
    const temFunc = empsFilial.some(e => e.turno === t.nome);
    const temVaga = funcoes.some(f => {
      const key = `${f.nome}__${t.nome}`;
      return (dadosF.vagas?.[key] || 0) > 0;
    });
    return temFunc || temVaga;
  });

  // ─────────────────────────────────────────────────────
  let html = '';

  // Summary row
  html += `
  <div class="summary-row">
    <div class="summary-card">
      <div class="summary-label">Total Quadro</div>
      ${podeEditar
        ? `<input class="num-input" type="number" min="0" id="input-total-quadro"
            value="${totalQuadro}" style="width:90px;font-size:22px;text-align:left;border:none;background:transparent;padding:0"
            oninput="atualizarResumo()" onchange="autoSalvarTotal(this.value)">`
        : `<div class="summary-value blue">${totalQuadro}</div>`}
    </div>
    <div class="summary-card">
      <div class="summary-label">Funcionários Cadastrados</div>
      <div class="summary-value green">${totalCad}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Afastados</div>
      <div class="summary-value red">${totalAfast}</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Vagas a Contratar</div>
      <div class="summary-value yellow" id="vagas-contratar">${vagas}</div>
    </div>
  </div>`;

  // Grade de turnos
  if (turnosMostrar.length) {
    html += `<div class="turnos-grid">`;
    turnosMostrar.forEach((turno, idx) => {
      const cor      = TURNO_CORES[idx % TURNO_CORES.length];
      const empsT    = empsFilial.filter(e => e.turno === turno.nome);
      const totalT   = empsT.length;

      html += `
      <div class="turno-card" style="border-top:3px solid ${cor.border}">
        <div class="turno-header">
          <div>
            <div class="turno-title" style="color:${cor.title}">
              🕐 ${turno.nome}
            </div>
            <div class="turno-sub">${totalT} colaborador(es)</div>
          </div>
          <div class="turno-total" style="color:${cor.total}">${totalT} total</div>
        </div>
        <table class="turno-table">
          <thead>
            <tr>
              <th>Função / Cargo</th>
              <th>Vagas</th>
              <th>Atual</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody>`;

      funcoes.forEach(func => {
        const key       = `${func.nome}__${turno.nome}`;
        const vagasDef  = dadosF.vagas?.[key] || 0;
        const atualCnt  = empsT.filter(e => e.role === func.nome).length;
        const diff      = vagasDef - atualCnt;

        let sitHtml;
        if (vagasDef === 0 && atualCnt === 0) {
          sitHtml = `<span style="color:var(--muted);font-size:12px">—</span>`;
        } else if (diff <= 0 && atualCnt >= vagasDef && vagasDef > 0) {
          sitHtml = `<span class="sit-badge sit-ok">✅ Completo</span>`;
        } else if (atualCnt > vagasDef && vagasDef > 0) {
          sitHtml = `<span class="sit-badge sit-excess">↑ ${atualCnt - vagasDef} excesso</span>`;
        } else if (diff <= 3 && diff > 0) {
          sitHtml = `<span class="sit-badge sit-warn">⚠️ ${diff} vaga(s)</span>`;
        } else if (diff > 3) {
          sitHtml = `<span class="sit-badge sit-risk">🔴 ${diff} vagas</span>`;
        } else {
          sitHtml = `<span class="sit-badge sit-ok">✅ Completo</span>`;
        }

        html += `
            <tr>
              <td>${func.nome}</td>
              <td>
                ${podeEditar
                  ? `<input class="num-input vaga-input" type="number" min="0"
                      data-key="${key}" value="${vagasDef}">`
                  : `<span class="num-input" style="display:inline-block;cursor:default">${vagasDef}</span>`}
              </td>
              <td>
                <span class="atual-val" style="color:${atualCnt>0?'var(--accent2)':'var(--muted)'}">
                  ${atualCnt}
                </span>
              </td>
              <td>${sitHtml}</td>
            </tr>`;
      });

      html += `
          </tbody>
        </table>
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `
    <div class="empty-state">
      <div class="empty-icon">🏭</div>
      <p style="font-size:14px">Nenhum turno com dados para esta filial</p>
      <p style="font-size:12px;margin-top:6px;color:var(--muted)">Cadastre funcionários nesta filial ou defina vagas nas configurações.</p>
    </div>`;
  }

  // Afastados
  html += `
  <div class="afastado-card">
    <div class="afastado-header">
      <div class="afastado-title">🚫 Afastados</div>
      <div class="afastado-badge">${afastados.length} funcionário(s)</div>
    </div>`;

  if (!afastados.length) {
    html += `<div style="color:var(--muted);font-size:13px;padding:8px 0">Nenhum funcionário afastado nesta filial.</div>`;
  } else {
    html += afastados.map(e => {
      const ini    = e.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
      let diasBadge = '';
      if (e.data_afastamento) {
        const inicio = new Date(e.data_afastamento+'T00:00:00');
        const dias   = Math.floor((hoje - inicio) / (1000*60*60*24)) + 1;
        diasBadge    = `<span class="dias-badge">⏱ ${dias} dia${dias!==1?'s':''}</span>`;
      }
      return `
      <div class="afastado-item">
        <div class="af-avatar">${ini}</div>
        <div class="af-info">
          <div class="afastado-name">${e.name}</div>
          <div class="afastado-role">${e.role||''}${e.dept?' · '+e.dept:''}</div>
        </div>
        <div class="af-right">
          ${diasBadge}
          <span style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
            background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)">
            🚫 Afastado
          </span>
        </div>
      </div>`;
    }).join('');
  }
  html += `</div>`;

  // Férias ativas
  const emFerias = empsFilial.filter(e => {
    if (!e.ferias || !e.data_ferias_inicio || !e.data_ferias_fim) return false;
    const ini = new Date(e.data_ferias_inicio+'T00:00:00');
    const fim = new Date(e.data_ferias_fim+'T00:00:00');
    return ini <= hoje && fim >= hoje;
  });

  if (emFerias.length) {
    html += `
    <div class="afastado-card" style="border-top:3px solid #22d3ee;margin-top:16px">
      <div class="afastado-header">
        <div class="afastado-title">🏖️ Em Férias</div>
        <div class="afastado-badge" style="background:rgba(34,211,238,.12);color:#22d3ee;border-color:rgba(34,211,238,.3)">${emFerias.length} funcionário(s)</div>
      </div>
      ${emFerias.map(e => {
        const ini    = e.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
        const fimD   = new Date(e.data_ferias_fim+'T00:00:00');
        const dias   = Math.floor((fimD - hoje) / (1000*60*60*24)) + 1;
        return `
        <div class="afastado-item">
          <div class="af-avatar" style="background:linear-gradient(135deg,#22d3ee,#4f8ef7)">${ini}</div>
          <div class="af-info">
            <div class="afastado-name">${e.name}</div>
            <div class="afastado-role">${e.role||''}${e.dept?' · '+e.dept:''}</div>
          </div>
          <div class="af-right">
            <span class="dias-badge" style="color:#22d3ee;border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.1)">
              ⏱ ${dias} dia${dias!==1?'s':''} restante${dias!==1?'s':''}
            </span>
            <span style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
              background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid rgba(34,211,238,.3)">
              🏖️ até ${fimD.toLocaleDateString('pt-BR')}
            </span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  document.getElementById('quadro-content').innerHTML = html;
}

// ── Atualiza vagas a contratar em tempo real ao editar total ──
async function atualizarResumo() {
  const store      = await getStore();
  const empsFilial = (store.employees||[]).filter(e =>
    e.filial === filialAtiva
  );
  const totalInput = document.getElementById('input-total-quadro');
  const total      = parseInt(totalInput?.value) || 0;
  const vagas      = Math.max(0, total - empsFilial.length);
  const vagasEl    = document.getElementById('vagas-contratar');
  if (vagasEl) vagasEl.textContent = vagas;
}
</script>
