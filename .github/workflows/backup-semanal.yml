name: Backup Semanal — CD Nagumo Performance

on:
  schedule:
    - cron: '0 3,7,11,15,19,23 * * *'   # 00h, 04h, 08h, 12h, 16h e 20h (Brasília)
  workflow_dispatch:                      # Permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install firebase@9 emailjs-com node-fetch
      - name: Executar backup
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: node scripts/backup.js
